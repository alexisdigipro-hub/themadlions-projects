<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- RoarRef (Alex, 6 Nov 2026): a 16:9 character reference sheet for AI. Fixed windows in 2 to 8 panel layouts; photos are
     dropped in, moved and zoomed inside their window; Export writes a 3840x2160 PNG. Plain HTML, CSS and JS, everything stays
     in this browser (IndexedDB 'roarref'). Its small page is lab/roarref/ (Lab experiment 10); also in Studio > Apps > In the browser. -->
<title>RoarRef · Character sheet for AI</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141415">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: one top row with every control, the 16:9 sheet filling the rest of the screen. Roar graphite glass, red that glows. */
:root{
  --bg:#141415; --panel:rgba(255,255,255,.055); --panel-2:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.09); --fg:#ececea; --muted:#9a9a97;
  --accent:#d40000; --accent-glow:rgba(212,0,0,.45);
  --display:"Jost",system-ui,sans-serif; --body:"DM Sans",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;overflow:hidden;
  background-image:radial-gradient(1200px 600px at 50% -10%,rgba(255,255,255,.05),transparent 60%)}
.app{height:100%;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mark{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em;white-space:nowrap}
.mark b{color:var(--accent);text-shadow:0 0 14px var(--accent-glow);font-weight:700}
.group{display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:var(--panel);
  border:1px solid var(--line);backdrop-filter:blur(14px);position:relative}
.lens{position:absolute;top:4px;height:calc(100% - 8px);border-radius:999px;background:var(--panel-2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 10px rgba(0,0,0,.35);transition:left .28s cubic-bezier(.3,.8,.3,1),width .28s;pointer-events:none}
.lay{position:relative;z-index:1;border:0;background:transparent;width:36px;flex:none;height:32px;border-radius:999px;cursor:pointer;
  display:grid;place-items:center;color:var(--muted);transition:color .2s}
.lay:hover,.lay[aria-pressed="true"]{color:var(--fg)}
.lay svg{width:26px;height:15px}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 13px var(--body);height:40px;padding:0 16px;
  border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;backdrop-filter:blur(14px);white-space:nowrap;
  transition:background .2s,transform .12s,box-shadow .2s}
.pill:hover{background:var(--panel-2)}
.pill:active{transform:scale(.96)}
.pill.main{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 0 22px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.25)}
.pill.main:hover{background:#e60a0a}
.pill[aria-pressed="true"]{background:var(--panel-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.pill svg,.ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ctl{display:flex;align-items:center;gap:7px;height:40px;padding:0 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
  font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ctl input[type=range]{width:56px;accent-color:var(--accent)}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.sw.pick{position:relative;overflow:hidden;background:conic-gradient(#f44,#fd4,#4f6,#4cf,#64f,#f4c,#f44)}
.sw.pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.spacer{flex:1;margin-left:-8px}
.pill.round{width:40px;padding:0;justify-content:center}
.pill.round .w{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stagewrap{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px var(--line);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none}
.frame{position:absolute;overflow:hidden;cursor:pointer;outline:0}
.frame.has{cursor:grab}
.frame.drag{cursor:grabbing}
.frame img{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}
.frame .empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;
  color:rgba(0,0,0,.42);font-size:calc(var(--k)*13px);letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  border:calc(var(--k)*2px) dashed rgba(0,0,0,.16);border-radius:inherit;box-sizing:border-box}
.dark .frame .empty{color:rgba(255,255,255,.45);border-color:rgba(255,255,255,.18)}
.frame .empty svg{width:calc(var(--k)*30px);height:calc(var(--k)*30px);stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.frame .empty small{font-weight:400;text-transform:none;letter-spacing:0;opacity:.8;font-size:calc(var(--k)*12px)}
.frame.over::after,.frame.sel::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.frame.sel::after{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 18px var(--accent-glow)}
.frame.over::after{box-shadow:inset 0 0 0 3px var(--accent);background:rgba(212,0,0,.12)}
.split{position:absolute;z-index:4;touch-action:none}
.split.v{width:18px;margin-left:-9px;cursor:col-resize}
.split.h{height:18px;margin-top:-9px;cursor:row-resize}
.split::after{content:"";position:absolute;border-radius:99px;background:rgba(255,255,255,.92);box-shadow:0 0 0 1px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.3);opacity:0;transition:opacity .2s}
.split.v::after{left:7px;width:4px;top:50%;height:46px;margin-top:-23px}
.split.h::after{top:7px;height:4px;left:50%;width:46px;margin-left:-23px}
.stage:hover .split::after{opacity:.55}
.split:hover::after,.split.on::after{opacity:1;background:var(--accent);box-shadow:0 0 14px var(--accent-glow)}
.label{position:absolute;left:calc(var(--k)*14px);bottom:calc(var(--k)*12px);font:600 calc(var(--k)*13px)/1 var(--body);letter-spacing:.14em;
  text-transform:uppercase;pointer-events:none}
.tools{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:999px;
  background:rgba(20,20,22,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(16px);z-index:5;cursor:default}
.ico{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.06);color:#eee;cursor:pointer;display:grid;place-items:center;
  transition:background .2s,transform .12s}
.ico:hover{background:rgba(255,255,255,.16)}
.ico:active{transform:scale(.92)}
.ico.del{color:#ff6b6b}
.ico.del:hover{background:rgba(212,0,0,.3);color:#fff}
.hint{position:absolute;bottom:-2px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .2s}
.card{background:rgba(32,32,34,.92);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:min(980px,100%);width:100%;
  display:flex;flex-direction:column;gap:14px;animation:pop .28s cubic-bezier(.3,1.4,.5,1);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.card h2{margin:0;font:700 20px var(--display)}
.card img{width:100%;border-radius:10px;display:block}
.card p{margin:0;color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@keyframes pop{from{transform:scale(.94);opacity:0}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(30,30,32,.95);border:1px solid var(--line);
  padding:10px 18px;border-radius:999px;font-size:13px;z-index:60;animation:fade .2s}
@media (max-width:820px){
  #layouts{max-width:100%;overflow-x:auto;scrollbar-width:none}
  .stagewrap{align-items:start}
  .ctl input[type=range]{width:60px}
  .pill .w{display:none}
  .pill{padding:0 12px}
  .tools{bottom:4px}
  .ico{width:30px;height:30px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="app">
  <div class="bar">
    <a class="mark" href="../" title="About RoarRef" style="color:inherit;text-decoration:none">Roar<b>Ref</b></a>
    <div class="group" id="layouts" role="group" aria-label="Layout"><span class="lens" id="lens"></span></div>
    <div class="ctl" title="Space between windows">Gap <input id="gap" type="range" min="0" max="60" value="14"></div>
    <div class="ctl" title="Round corners">Round <input id="rad" type="range" min="0" max="40" value="0"></div>
    <div class="ctl" id="sheetSw" title="Sheet colour">Sheet</div>
    <div class="ctl" id="fillSw" title="Colour behind the photos">Fill</div>
    <button class="pill round" id="labels" aria-pressed="false" title="Show the view names on the sheet">
      <svg viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></svg><span class="w">Labels</span></button>
    <button class="pill round" id="add" style="margin-left:auto" title="Add photos to the empty windows">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="w">Add photos</span></button>
    <button class="pill round" id="clear" title="Empty every window">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span class="w">Clear</span></button>
    <button class="pill main" id="export" title="Save the sheet as a PNG">
      <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="w">Export</span></button>
  </div>
  <div class="stagewrap" id="wrap">
    <div class="stage" id="stage"></div>
  </div>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>

<script>
const BW = 1600, BH = 900;
const LAYOUTS = [
  {id:'t3', name:'Front, back, face', cols:[1,1,1], rows:[1], cells:[[0,0,1,1,'Front'],[1,0,1,1,'Back'],[2,0,1,1,'Face']]},
  {id:'t4', name:'Front, side, back, face', cols:[1,1,1,1], rows:[1], cells:[[0,0,1,1,'Front'],[1,0,1,1,'Side'],[2,0,1,1,'Back'],[3,0,1,1,'Face']]},
  {id:'t5', name:'Five views', cols:[1,1,1,1,1.25], rows:[1], cells:[[0,0,1,1,'Front'],[1,0,1,1,'3/4'],[2,0,1,1,'Side'],[3,0,1,1,'Back'],[4,0,1,1,'Face']]},
  {id:'t6', name:'Six in a row', cols:[1,1,1,1,1,1], rows:[1], cells:[[0,0,1,1,'Front'],[1,0,1,1,'3/4 left'],[2,0,1,1,'Side'],[3,0,1,1,'Back'],[4,0,1,1,'3/4 right'],[5,0,1,1,'Face']]},
  {id:'bf', name:'Three bodies, two faces', cols:[1,1,1,1.1], rows:[1,1], cells:[[0,0,1,2,'Front'],[1,0,1,2,'Side'],[2,0,1,2,'Back'],[3,0,1,1,'Face'],[3,1,1,1,'Profile']]},
  {id:'b6', name:'Two bodies, six faces', cols:[1,1,1,1,1], rows:[1,1], cells:[[0,0,1,2,'Front'],[1,0,1,2,'Back'],[2,0,1,1,'Neutral'],[3,0,1,1,'Smile'],[4,0,1,1,'Angry'],[2,1,1,1,'Sad'],[3,1,1,1,'Surprised'],[4,1,1,1,'Profile']]},
  {id:'h4', name:'Hero and four', cols:[2,1,1], rows:[1,1], cells:[[0,0,1,2,'Hero'],[1,0,1,1,'Front'],[2,0,1,1,'Back'],[1,1,1,1,'Face'],[2,1,1,1,'Detail']]},
  {id:'e6', name:'Six expressions', cols:[1,1,1], rows:[1,1], cells:[[0,0,1,1,'Neutral'],[1,0,1,1,'Smile'],[2,0,1,1,'Angry'],[0,1,1,1,'Sad'],[1,1,1,1,'Surprised'],[2,1,1,1,'Profile']]},
  {id:'s2', name:'Body and face', cols:[1,1], rows:[1], cells:[[0,0,1,1,'Body'],[1,0,1,1,'Face']]},
];
const SHEET_COLORS = ['#ffffff','#8b8b88','#000000'];
const FILL_COLORS = ['#ededeb','#ffffff','#2a2a2a'];

let S = {layout:'t3', gap:14, rad:0, sheet:'#ffffff', fill:'#ededeb', labels:false, sizes:{}};
let photos = [];   // index -> {url, blob, w, h, s, ox, oy, flip}
let sel = -1;

const $ = id => document.getElementById(id);
const stage = $('stage'), wrap = $('wrap');
const lay = () => LAYOUTS.find(l => l.id === S.layout) || LAYOUTS[0];

// the windows' widths and heights: the layout's own, or what was dragged on the lines between them (S.sizes[layout])
const sizesOf = L => { const z = (S.sizes||{})[L.id] || {}; return {
  cols: z.cols && z.cols.length===L.cols.length ? z.cols : L.cols, rows: z.rows && z.rows.length===L.rows.length ? z.rows : L.rows }; };
function rects(L, gap, pad){
  const sum = a => a.reduce((x,y)=>x+y,0), Z = sizesOf(L);
  const iw = BW - 2*pad - (L.cols.length-1)*gap, ih = BH - 2*pad - (L.rows.length-1)*gap;
  const cw = Z.cols.map(f => f/sum(Z.cols)*iw), rh = Z.rows.map(f => f/sum(Z.rows)*ih);
  return L.cells.map(([c,r,cs,rs,label]) => ({
    x: pad + sum(cw.slice(0,c)) + c*gap, y: pad + sum(rh.slice(0,r)) + r*gap,
    w: sum(cw.slice(c,c+cs)) + (cs-1)*gap, h: sum(rh.slice(r,r+rs)) + (rs-1)*gap, label }));
}
const pad = () => S.gap;  // outer border matches the gap, like a contact sheet

function lum(hex){ const n=parseInt(hex.slice(1),16); return (0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255; }

/* ---------- top bar ---------- */
function miniSvg(L){
  const R = rects(L, 60, 0);
  return `<svg viewBox="0 0 1600 900">${R.map(r=>`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="70" fill="currentColor"/>`).join('')}</svg>`;
}
LAYOUTS.forEach(L => {
  const b = document.createElement('button');
  b.className = 'lay'; b.title = L.name; b.setAttribute('aria-label', L.name); b.dataset.id = L.id;
  b.innerHTML = miniSvg(L);
  b.onclick = () => { S.layout = L.id; sel = -1; render(); save(); };
  $('layouts').appendChild(b);
});
function moveLens(){
  const b = $('layouts').querySelector(`[data-id="${S.layout}"]`); if(!b) return;
  $('lens').style.left = b.offsetLeft + 'px'; $('lens').style.width = b.offsetWidth + 'px';
  $('layouts').querySelectorAll('.lay').forEach(x => x.setAttribute('aria-pressed', x === b));
}
function swatches(el, colors, key){
  el.querySelectorAll('.sw').forEach(x=>x.remove());
  colors.forEach(c => {
    const b = document.createElement('button'); b.className='sw'; b.style.background=c; b.title=c; b.setAttribute('aria-label', key+' '+c);
    b.setAttribute('aria-pressed', S[key].toLowerCase()===c);
    b.onclick = () => { S[key]=c; render(); save(); }; el.appendChild(b);
  });
  const p = document.createElement('label'); p.className='sw pick'; p.title='Any colour';
  const custom = !colors.includes(S[key].toLowerCase());
  p.setAttribute('aria-pressed', custom); if(custom) p.style.background = S[key];
  p.innerHTML = `<input type="color" id="pick-${key}" value="${S[key]}" aria-label="Any ${key} colour">`;
  p.querySelector('input').oninput = e => { S[key]=e.target.value; render(); save(); };
  el.appendChild(p);
}
$('gap').oninput = e => { S.gap=+e.target.value; render(); save(); };
$('rad').oninput = e => { S.rad=+e.target.value; render(); save(); };
$('labels').onclick = () => { S.labels=!S.labels; render(); save(); };
$('add').onclick = () => { pickTarget = -1; $('file').click(); };
$('clear').onclick = () => { if(!photos.some(Boolean)) return; askClear(); };
$('export').onclick = exportPng;

/* ---------- sheet ---------- */
function fit(){
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const w = Math.min(W, H*16/9);
  stage.style.width = w+'px'; stage.style.height = (w*9/16)+'px';
  stage.style.setProperty('--k', w/BW);
}
new ResizeObserver(fit).observe(wrap);

function imgBox(p, r){
  const cover = Math.max(r.w/p.w, r.h/p.h), s = cover*p.s;
  const dw = p.w*s, dh = p.h*s;
  return {x:(r.w-dw)/2+p.ox, y:(r.h-dh)/2+p.oy, w:dw, h:dh};
}
const pct = (v, of) => (v/of*100)+'%';

function render(){
  const L = lay(), R = rects(L, S.gap, pad());
  stage.style.background = S.sheet;
  stage.classList.toggle('dark', lum(S.fill) < .5);
  $('gap').value = S.gap; $('rad').value = S.rad; $('labels').setAttribute('aria-pressed', S.labels);
  swatches($('sheetSw'), SHEET_COLORS, 'sheet'); swatches($('fillSw'), FILL_COLORS, 'fill');
  moveLens();
  stage.innerHTML = '';
  R.forEach((r, i) => {
    const f = document.createElement('div');
    f.className = 'frame'; f.dataset.i = i; f.tabIndex = 0;
    Object.assign(f.style, {left:pct(r.x,BW), top:pct(r.y,BH), width:pct(r.w,BW), height:pct(r.h,BH),
      background:S.fill, borderRadius:`calc(var(--k)*${S.rad}px)`});
    const p = photos[i];
    if(p){
      f.classList.add('has');
      const b = imgBox(p, r), im = document.createElement('img');
      im.src = p.url; im.alt = r.label; im.draggable = false;
      Object.assign(im.style, {left:pct(b.x,r.w), top:pct(b.y,r.h), width:pct(b.w,r.w), height:pct(b.h,r.h),
        transform: p.flip ? 'scaleX(-1)' : ''});
      f.appendChild(im);
    } else {
      f.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 8"/></svg>${r.label}<small>Drop a photo or click</small></div>`;
    }
    if(S.labels){
      const lb = document.createElement('div'); lb.className='label'; lb.textContent = r.label;
      lb.style.color = p ? '#fff' : (lum(S.fill)<.5 ? '#fff' : '#111');
      if(p) lb.style.textShadow = '0 1px 6px rgba(0,0,0,.5)';
      f.appendChild(lb);
    }
    if(i === sel){ f.classList.add('sel'); if(p) f.appendChild(toolbar(i)); }
    stage.appendChild(f);
  });
  splitters(L, R);
  fit();
}
function frameEl(i){ return stage.querySelector(`.frame[data-i="${i}"]`); }
function place(i){ // move only the picture, no full redraw while dragging
  const p = photos[i], f = frameEl(i); if(!p||!f) return;
  const r = rects(lay(), S.gap, pad())[i], b = imgBox(p, r), im = f.querySelector('img');
  Object.assign(im.style, {left:pct(b.x,r.w), top:pct(b.y,r.h), width:pct(b.w,r.w), height:pct(b.h,r.h), transform:p.flip?'scaleX(-1)':''});
}

/* the lines between the windows: drag one and the window on one side grows as the other shrinks */
function splitters(L, R){
  const Z = sizesOf(L), P = pad(), cuts = [];
  const sum = a => a.reduce((x,y)=>x+y,0);
  const iw = BW - 2*P - (L.cols.length-1)*S.gap, ih = BH - 2*P - (L.rows.length-1)*S.gap;
  let x = P; for(let k=0;k<Z.cols.length-1;k++){ x += Z.cols[k]/sum(Z.cols)*iw; cuts.push({axis:'cols', k, at:x + S.gap/2, inner:iw}); x += S.gap; }
  let y = P; for(let k=0;k<Z.rows.length-1;k++){ y += Z.rows[k]/sum(Z.rows)*ih; cuts.push({axis:'rows', k, at:y + S.gap/2, inner:ih}); y += S.gap; }
  cuts.forEach(c => {
    // a row line only spans the columns that are really split there
    let from = P, to = c.axis==='cols' ? BH-P : BW-P;
    if(c.axis==='rows'){
      const split = R.filter(r => Math.abs(r.y + r.h + S.gap/2 - c.at) < 1);
      if(!split.length) return;
      from = Math.min(...split.map(r=>r.x)); to = Math.max(...split.map(r=>r.x+r.w));
    }
    const d = document.createElement('div'); d.className = 'split ' + (c.axis==='cols' ? 'v' : 'h');
    d.title = 'Drag to resize · double-click to even out';
    if(c.axis==='cols') Object.assign(d.style, {left:pct(c.at,BW), top:pct(from,BH), height:pct(to-from,BH)});
    else Object.assign(d.style, {top:pct(c.at,BH), left:pct(from,BW), width:pct(to-from,BW)});
    d.onpointerdown = e => {
      e.stopPropagation(); e.preventDefault(); d.setPointerCapture(e.pointerId); d.classList.add('on');
      const start = c.axis==='cols' ? e.clientX : e.clientY, arr = sizesOf(L)[c.axis].slice(), tot = sum(arr), a0 = arr[c.k], b0 = arr[c.k+1];
      const min = tot*0.06;
      const move = ev => {
        const dpx = ((c.axis==='cols' ? ev.clientX : ev.clientY) - start) * unit();
        let df = dpx / c.inner * tot; df = Math.max(min - a0, Math.min(b0 - min, df));
        arr[c.k] = a0 + df; arr[c.k+1] = b0 - df;
        S.sizes = S.sizes || {}; S.sizes[L.id] = Object.assign({}, S.sizes[L.id], {[c.axis]: arr.slice()});
        relayout(d, c);
      };
      const up = () => { d.removeEventListener('pointermove', move); d.removeEventListener('pointerup', up); d.removeEventListener('pointercancel', up); render(); save(); };
      d.addEventListener('pointermove', move); d.addEventListener('pointerup', up); d.addEventListener('pointercancel', up);
    };
    d.ondblclick = e => { e.stopPropagation(); if(S.sizes && S.sizes[L.id]){ delete S.sizes[L.id][c.axis]; render(); save(); } };
    stage.appendChild(d);
  });
}
function relayout(d, c){ // move the windows, their photos and the held line while it is dragged, without rebuilding them
  const L = lay(), R = rects(L, S.gap, pad());
  R.forEach((r,i) => { const f = frameEl(i); if(!f) return;
    Object.assign(f.style, {left:pct(r.x,BW), top:pct(r.y,BH), width:pct(r.w,BW), height:pct(r.h,BH)}); if(photos[i]) place(i); });
  const Z = sizesOf(L)[c.axis], tot = Z.reduce((x,y)=>x+y,0), P = pad();
  let at = P; for(let k=0;k<=c.k;k++) at += Z[k]/tot*c.inner + (k<c.k ? S.gap : 0);
  at += S.gap/2;
  if(c.axis==='cols') d.style.left = pct(at,BW); else d.style.top = pct(at,BH);
}
const IC = {
  minus:'<path d="M5 12h14"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  fill:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  fit:'<rect x="5" y="7" width="14" height="10" rx="2"/><path d="M2 4h20M2 20h20"/>',
  flip:'<path d="M12 3v18M8 7l-5 5 5 5V7zM16 7l5 5-5 5V7z"/>',
  swap:'<path d="M7 4v13M3 13l4 4 4-4M17 20V7M13 11l4-4 4 4"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',
};
function toolbar(i){
  const t = document.createElement('div'); t.className='tools';
  const btn = (ic, title, fn, cls='') => { const b=document.createElement('button'); b.className='ico '+cls; b.title=title; b.setAttribute('aria-label',title);
    b.innerHTML=`<svg viewBox="0 0 24 24">${IC[ic]}</svg>`; b.onclick=e=>{e.stopPropagation(); fn();}; b.onpointerdown=e=>e.stopPropagation(); t.appendChild(b); };
  btn('minus','Zoom out',()=>zoomBy(i,1/1.15));
  btn('plus','Zoom in',()=>zoomBy(i,1.15));
  btn('fill','Fill the window',()=>{ Object.assign(photos[i],{s:1,ox:0,oy:0}); place(i); save(); });
  btn('fit','Show the whole photo',()=>{ const p=photos[i], r=rects(lay(),S.gap,pad())[i];
    p.s = Math.min(r.w/p.w, r.h/p.h)/Math.max(r.w/p.w, r.h/p.h); p.ox=0; p.oy=0; place(i); save(); });
  btn('flip','Mirror',()=>{ photos[i].flip=!photos[i].flip; place(i); save(); });
  btn('swap','Replace photo',()=>{ pickTarget=i; $('file').click(); });
  btn('trash','Remove photo',()=>{ photos[i]=null; render(); save(); },'del');
  return t;
}
function zoomBy(i, f, cx=0, cy=0){
  const p = photos[i]; if(!p) return;
  const s2 = Math.min(10, Math.max(.15, p.s*f)); f = s2/p.s;
  p.ox = cx - (cx-p.ox)*f; p.oy = cy - (cy-p.oy)*f; p.s = s2;
  place(i); saveSoon();
}

/* ---------- moving and zooming inside a window ---------- */
const ptrs = new Map(); let gesture = null;
const unit = () => BW / stage.clientWidth;
function localPt(i, e){ // pointer relative to the window centre, in sheet units
  const b = frameEl(i).getBoundingClientRect(), k = unit();
  return {x:(e.clientX-b.left-b.width/2)*k, y:(e.clientY-b.top-b.height/2)*k};
}
stage.addEventListener('pointerdown', e => {
  const f = e.target.closest('.frame'); if(!f) return;
  const i = +f.dataset.i;
  if(!photos[i]){ sel=i; render(); pickTarget=i; $('file').click(); return; }
  if(sel !== i){ sel = i; render(); }
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  stage.setPointerCapture(e.pointerId);
  if(ptrs.size === 1){ const p=photos[i]; gesture = {i, sx:e.clientX, sy:e.clientY, ox:p.ox, oy:p.oy}; frameEl(i).classList.add('drag'); }
  else if(ptrs.size === 2 && gesture){
    const [a,b] = [...ptrs.values()];
    gesture.pinch = {d:Math.hypot(a.x-b.x,a.y-b.y), s:photos[gesture.i].s};
  }
});
stage.addEventListener('pointermove', e => {
  if(!gesture || !ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const p = photos[gesture.i]; if(!p) return;
  if(gesture.pinch && ptrs.size >= 2){
    const [a,b] = [...ptrs.values()];
    const d = Math.hypot(a.x-b.x,a.y-b.y);
    const mid = localPt(gesture.i, {clientX:(a.x+b.x)/2, clientY:(a.y+b.y)/2});
    zoomBy(gesture.i, (gesture.pinch.s*d/gesture.pinch.d)/p.s, mid.x, mid.y);
  } else if(!gesture.pinch){
    const k = unit();
    p.ox = gesture.ox + (e.clientX-gesture.sx)*k; p.oy = gesture.oy + (e.clientY-gesture.sy)*k;
    place(gesture.i);
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size === 0 && gesture){ frameEl(gesture.i)?.classList.remove('drag'); gesture=null; save(); }
  else if(gesture && ptrs.size === 1){ const [a]=[...ptrs.values()], p=photos[gesture.i]; Object.assign(gesture,{pinch:null,sx:a.x,sy:a.y,ox:p.ox,oy:p.oy}); }
}
stage.addEventListener('pointerup', endPtr); stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('wheel', e => {
  const f = e.target.closest('.frame'); if(!f) return; const i=+f.dataset.i; if(!photos[i]) return;
  e.preventDefault();
  const c = localPt(i, e);
  zoomBy(i, Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015)), c.x, c.y);
}, {passive:false});
stage.addEventListener('dblclick', e => {
  const f = e.target.closest('.frame'); if(!f) return; const i=+f.dataset.i;
  if(photos[i]){ Object.assign(photos[i],{s:1,ox:0,oy:0}); place(i); save(); }
});
document.addEventListener('pointerdown', e => { if(!e.target.closest('.stage') && !e.target.closest('.modal') && sel>=0 && !e.target.closest('.bar')){ sel=-1; render(); } });
document.addEventListener('keydown', e => {
  if(e.target.closest && e.target.closest('input')) return;
  if(e.key==='Escape' && sel>=0){ sel=-1; render(); return; }
  if(sel<0 || !photos[sel]) return;
  const p = photos[sel], st = e.shiftKey ? 20 : 4;
  const moves = {ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]};
  if(moves[e.key]){ e.preventDefault(); p.ox+=moves[e.key][0]; p.oy+=moves[e.key][1]; place(sel); saveSoon(); }
  else if(e.key==='+'||e.key==='='){ zoomBy(sel,1.08); }
  else if(e.key==='-'){ zoomBy(sel,1/1.08); }
  else if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); photos[sel]=null; render(); save(); }
});

/* ---------- bringing photos in ---------- */
let pickTarget = -1;
$('file').onchange = e => { addFiles([...e.target.files], pickTarget); e.target.value=''; };
function loadImage(blob){
  return new Promise((res, rej) => { const url = URL.createObjectURL(blob), im = new Image();
    im.onload = () => res({url, blob, w:im.naturalWidth, h:im.naturalHeight, s:1, ox:0, oy:0, flip:false});
    im.onerror = () => { URL.revokeObjectURL(url); rej(); }; im.src = url; });
}
async function addFiles(files, target){
  files = files.filter(f => f.type.startsWith('image/'));
  if(!files.length) return;
  const n = lay().cells.length, slots = [];
  if(target >= 0) slots.push(target);
  for(let i=0;i<n && slots.length<files.length;i++) if(!photos[i] && !slots.includes(i)) slots.push(i);
  let bad = 0;
  for(let k=0;k<files.length && k<slots.length;k++){
    try{ photos[slots[k]] = await loadImage(files[k]); }catch{ bad++; }
  }
  if(files.length > slots.length) toast(`${files.length-slots.length} photo(s) left out: every window is full`);
  if(bad) toast('That file could not be opened as a picture');
  sel = slots[0] ?? sel; render(); save();
}
let overEl = null;
function setOver(el){ if(overEl===el) return; overEl?.classList.remove('over'); overEl=el; el?.classList.add('over'); }
window.addEventListener('dragover', e => { e.preventDefault(); setOver(e.target.closest?.('.frame') || null); });
window.addEventListener('dragleave', e => { if(!e.relatedTarget) setOver(null); });
window.addEventListener('drop', e => {
  e.preventDefault(); const f = e.target.closest?.('.frame'); setOver(null);
  addFiles([...e.dataTransfer.files], f ? +f.dataset.i : -1);
});
window.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.files||[])]; if(!files.length) return;
  e.preventDefault(); addFiles(files, sel >= 0 ? sel : -1);
});

/* ---------- export ---------- */
async function drawSheet(W){
  const k = W/BW, c = document.createElement('canvas'); c.width=W; c.height=Math.round(W*9/16);
  const g = c.getContext('2d'); g.imageSmoothingQuality='high';
  g.fillStyle=S.sheet; g.fillRect(0,0,c.width,c.height);
  const R = rects(lay(), S.gap, pad());
  for(let i=0;i<R.length;i++){
    const r = R[i], p = photos[i];
    g.save(); g.beginPath();
    g.roundRect ? g.roundRect(r.x*k, r.y*k, r.w*k, r.h*k, S.rad*k) : g.rect(r.x*k, r.y*k, r.w*k, r.h*k);
    g.clip(); g.fillStyle=S.fill; g.fillRect(r.x*k, r.y*k, r.w*k, r.h*k);
    if(p){
      const im = new Image(); im.src = p.url; await im.decode();
      const b = imgBox(p, r);
      g.translate((r.x+b.x+b.w/2)*k, (r.y+b.y+b.h/2)*k);
      if(p.flip) g.scale(-1,1);
      g.drawImage(im, -b.w*k/2, -b.h*k/2, b.w*k, b.h*k);
      g.setTransform(1,0,0,1,0,0);
    }
    if(S.labels){
      g.font = `600 ${13*k}px "DM Sans", system-ui, sans-serif`;
      if('letterSpacing' in g) g.letterSpacing = (13*k*.14)+'px';
      g.fillStyle = p ? '#fff' : (lum(S.fill)<.5 ? '#fff' : '#111');
      if(p){ g.shadowColor='rgba(0,0,0,.5)'; g.shadowBlur=6*k; }
      g.textBaseline='alphabetic';
      g.fillText(r.label.toUpperCase(), (r.x+14)*k, (r.y+r.h-12)*k);
    }
    g.restore();
  }
  return new Promise(res => c.toBlob(res, 'image/png'));
}
async function exportPng(){
  const btn = $('export'); btn.disabled = true;
  try{
    const blob = await drawSheet(3840);
    const name = `character-sheet-${new Date().toISOString().slice(0,10)}.png`;
    const file = new File([blob], name, {type:'image/png'});
    if(matchMedia('(pointer:coarse)').matches && navigator.canShare?.({files:[file]})){
      try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==='AbortError') return; }
    }
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('Saved to your Downloads');
  } catch(e){ toast('The sheet could not be made. Try again with fewer or smaller photos.'); }
  finally { btn.disabled = false; }
}
function askClear(){
  const m = document.createElement('div'); m.className='modal';
  m.innerHTML = `<div class="card" style="max-width:420px"><h2>Empty every window?</h2><p>The photos leave this sheet. The layout and colours stay.</p><div class="row"><span class="spacer"></span><button class="pill" id="no">Keep them</button><button class="pill main" id="yes">Empty</button></div></div>`;
  m.onclick = e => { if(e.target.id==='yes'){ photos=[]; sel=-1; render(); save(); } if(e.target===m||e.target.id==='no'||e.target.id==='yes') m.remove(); };
  document.body.appendChild(m);
}
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(), 2600); }

/* ---------- keep the work in this browser ---------- */
let dbp = null;
function idb(){ if(!dbp) dbp = new Promise((res,rej)=>{ try{ const r=indexedDB.open('roarref',1); r.onupgradeneeded=()=>r.result.createObjectStore('s'); r.onsuccess=()=>res(r.result); r.onerror=rej; }catch(e){ rej(e); } }); return dbp; }
async function save(){
  try{ const d = await idb(); const tx = d.transaction('s','readwrite');
    tx.objectStore('s').put({S, photos: photos.map(p => p ? {blob:p.blob,w:p.w,h:p.h,s:p.s,ox:p.ox,oy:p.oy,flip:p.flip} : null)}, 'state');
  }catch{}
}
let st; function saveSoon(){ clearTimeout(st); st=setTimeout(save, 400); }
async function restore(){
  try{
    const d = await idb();
    const v = await new Promise((res,rej)=>{ const r=d.transaction('s').objectStore('s').get('state'); r.onsuccess=()=>res(r.result); r.onerror=rej; });
    if(v){ S = Object.assign(S, v.S); photos = (v.photos||[]).map(p => p ? Object.assign({}, p, {url:URL.createObjectURL(p.blob)}) : null); }
  }catch{}
  render();
}
render(); restore();
</script>
<script src="../../../stats.js" defer></script>
</body>
