<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- RoarRef (Alex, 6 Nov 2026): a 16:9 character reference sheet for AI. Fixed windows in 2 to 8 panel layouts; photos are
     dropped in, moved and zoomed inside their window; Export writes a 3840x2160 PNG. Plain HTML, CSS and JS, everything stays
     in this browser (IndexedDB 'roarref'). Its small page is lab/roarref/ (Lab experiment 10); also in Studio > Apps > In the browser. -->
<title>RoarRef · Character sheet for AI</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141415">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: one top row with every control, the 16:9 sheet filling the rest of the screen. Roar graphite glass, red that glows. */
:root{
  --bg:#141415; --panel:rgba(255,255,255,.055); --panel-2:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.09); --fg:#ececea; --muted:#9a9a97;
  --accent:#d40000; --accent-glow:rgba(212,0,0,.45);
  --display:"Jost",system-ui,sans-serif; --body:"DM Sans",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;overflow:hidden;
  background-image:radial-gradient(1200px 600px at 50% -10%,rgba(255,255,255,.05),transparent 60%)}
.app{height:100%;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mark{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em;white-space:nowrap}
.mark b{color:var(--accent);text-shadow:0 0 14px var(--accent-glow);font-weight:700}
.group{display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:var(--panel);
  border:1px solid var(--line);backdrop-filter:blur(14px);position:relative}
.lens{position:absolute;top:4px;height:calc(100% - 8px);border-radius:999px;background:var(--panel-2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 10px rgba(0,0,0,.35);transition:left .28s cubic-bezier(.3,.8,.3,1),width .28s;pointer-events:none}
.lay{position:relative;z-index:1;border:0;background:transparent;width:32px;flex:none;height:32px;border-radius:999px;cursor:pointer;
  display:grid;place-items:center;color:var(--muted);transition:color .2s}
.lay:hover,.lay[aria-pressed="true"]{color:var(--fg)}
.lay svg{width:26px;height:15px}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 13px var(--body);height:40px;padding:0 16px;
  border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;backdrop-filter:blur(14px);white-space:nowrap;
  transition:background .2s,transform .12s,box-shadow .2s}
.pill:hover{background:var(--panel-2)}
.pill:active{transform:scale(.96)}
.pill.main{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 0 22px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.25)}
.pill.main:hover{background:#e60a0a}
.pill[aria-pressed="true"]{background:var(--panel-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.pill svg,.ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ctl{display:flex;align-items:center;gap:7px;height:40px;padding:0 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
  font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ctl input[type=range]{width:56px;accent-color:var(--accent)}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.sw.pick{position:relative;overflow:hidden;background:conic-gradient(#f44,#fd4,#4f6,#4cf,#64f,#f4c,#f44)}
.sw.pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.spacer{flex:1;margin-left:-8px}
.pill.round{width:40px;padding:0;justify-content:center}
.pill.round .w{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stagewrap{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.stage{position:relative;max-width:100%;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px var(--line);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none}
.frame{position:absolute;overflow:hidden;cursor:pointer;outline:0}
.frame.has{cursor:grab}
.frame.drag{cursor:grabbing}
.frame img,.frame canvas.ph{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}
.frame .empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;
  color:rgba(0,0,0,.42);font-size:max(10px,calc(var(--k)*13px));letter-spacing:.02em;font-weight:600;
  border:calc(var(--k)*2px) dashed rgba(0,0,0,.16);border-radius:inherit;box-sizing:border-box}
.dark .frame .empty{color:rgba(255,255,255,.45);border-color:rgba(255,255,255,.18)}
.frame .empty svg{width:max(20px,calc(var(--k)*30px));height:max(20px,calc(var(--k)*30px));stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.frame .empty small{font-weight:400;text-transform:none;letter-spacing:0;opacity:.8;font-size:max(9px,calc(var(--k)*12px))}
.frame.over::after,.frame.sel::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.frame.sel::after{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 18px var(--accent-glow)}
.frame.over::after{box-shadow:inset 0 0 0 3px var(--accent);background:rgba(212,0,0,.12)}
.split{position:absolute;z-index:4;touch-action:none}
.split.v{width:18px;margin-left:-9px;cursor:col-resize}
.split.h{height:18px;margin-top:-9px;cursor:row-resize}
.split::after{content:"";position:absolute;border-radius:99px;background:rgba(255,255,255,.92);box-shadow:0 0 0 1px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.3);opacity:0;transition:opacity .2s}
.split.v::after{left:7px;width:4px;top:50%;height:46px;margin-top:-23px}
.split.h::after{top:7px;height:4px;left:50%;width:46px;margin-left:-23px}
.stage:hover .split::after{opacity:.55}
.split:hover::after,.split.on::after{opacity:1;background:var(--accent);box-shadow:0 0 14px var(--accent-glow)}
.cover{position:absolute;z-index:6;cursor:move;touch-action:none;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.cover.sel{outline:2px solid var(--accent);outline-offset:3px}
.cover .rs{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--accent);cursor:nwse-resize}
.cover .tools{bottom:auto;top:-52px;white-space:nowrap}
.cover .tools .ico[aria-pressed="true"]{background:rgba(255,255,255,.22)}
.cover .tools .sw{width:24px;height:24px;flex:none;align-self:center;margin:0 2px}
.label{position:absolute;left:calc(var(--k)*14px);bottom:calc(var(--k)*12px);font:600 calc(var(--k)*13px)/1 var(--body);letter-spacing:.04em;
  pointer-events:none}
.tools{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:999px;
  background:rgba(20,20,22,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(16px);z-index:5;cursor:default}
.ico{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.06);color:#eee;cursor:pointer;display:grid;place-items:center;
  transition:background .2s,transform .12s}
.ico:hover{background:rgba(255,255,255,.16)}
.ico:active{transform:scale(.92)}
.ico.del{color:#ff6b6b}
.ico.del:hover{background:rgba(212,0,0,.3);color:#fff}
.panel{display:none}
/* computer (Alex, 7 Nov: "group it like the phone, the account top right"): the sheet, and a column on the right with
   Layout / Look / Window; the account and the sheet you are on, top right */
.work{flex:1;min-height:0;display:grid;grid-template-columns:76px 320px minmax(0,1fr);gap:14px}
/* tool rail (Alex, 11 Nov, picked from three drawings: "the 2nd"): icons on the left, one panel open at a time, the sheet big */
.rail{order:0;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:20px;background:var(--panel);border:1px solid var(--line);align-self:start}
.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border:0;border-radius:14px;background:transparent;color:var(--muted);font:600 10.5px var(--body);cursor:pointer;transition:background .2s,color .2s}
.rail button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rail button:hover{color:var(--fg)}
.rail button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.rail hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
.side{order:1}.stagewrap{order:2}
.side .ptl{margin:0 0 2px;font:700 20px var(--display);letter-spacing:.01em}
.side .atabs{display:none}
.side .sec{gap:12px;padding:16px}
.stagewrap{min-width:0}
.side{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sec-h{display:flex;align-items:center;justify-content:space-between;width:100%;margin:0;padding:0;border:0;background:none;cursor:pointer;
  font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sec-h:hover{color:var(--fg)}
.sec-h svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;transition:transform .2s}
.sec.shut .sec-h svg{transform:rotate(-90deg)}
.sec.shut > :not(.sec-h){display:none}
.sec.shut{gap:0}
.srow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.side .group{background:rgba(255,255,255,.04)}
.plab{margin:6px 0 -4px;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.plab:first-of-type{margin-top:2px}
.side #layouts,.side #ratios{display:grid;width:100%;box-sizing:border-box;gap:8px;background:none;border:0;padding:0;box-shadow:none;border-radius:0}
.side #layouts{grid-template-columns:repeat(3,1fr)}
.side #ratios{grid-template-columns:repeat(4,1fr)}
.side #layouts .lens,.side #ratios .lens{display:none}
.side #layouts .lay,.side #ratios .lay{width:auto;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s,transform .12s;color:var(--muted)}
.side #layouts .lay{height:58px}
.side #layouts .lay svg{width:58px;height:33px}
.side #ratios .lay{height:62px;padding:0;gap:0;grid-template-rows:34px auto;align-content:center}
.side #layouts .lay:hover,.side #ratios .lay:hover{background:rgba(255,255,255,.09);color:var(--fg)}
.side #layouts .lay:active,.side #ratios .lay:active{transform:scale(.96)}
.side #layouts .lay[aria-pressed="true"],.side #ratios .lay[aria-pressed="true"]{background:var(--panel-2);border-color:rgba(255,255,255,.34);color:var(--fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 4px 14px rgba(0,0,0,.3)}
.shp{display:none}
.side .shp{display:block;border:1.6px solid currentColor;border-radius:4px;box-sizing:border-box;align-self:center}
.side .pill.wide svg + .w{display:inline}
.side .ctl{width:100%;box-sizing:border-box;background:rgba(255,255,255,.04);justify-content:space-between}
.side .ctl input[type=range]{flex:1;width:auto!important;min-width:0}
.side .pill.wide{flex:1;justify-content:center}
.side .pill.round{width:40px;padding:0;justify-content:center}
.side #mtools{gap:6px}
.side #mtools .ico{width:38px;height:38px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.side #mtools > span{display:none}
.side .off{opacity:.4;pointer-events:none}
.hint2{color:var(--muted);font-size:13px;margin:0}
#poolBox{display:flex;flex-direction:column;gap:10px;width:100%;min-width:0}
#poolBox .poolhead{display:flex;align-items:center;gap:10px;width:100%}
#poolBox .pcnt{margin-left:auto;color:var(--muted);font:600 12px var(--body);letter-spacing:.04em}
.poolgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.pth{position:relative;min-width:0;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:grab;padding:0;transition:transform .12s,border-color .15s}
.pth:hover{border-color:rgba(255,255,255,.3)} .pth:active{transform:scale(.97);cursor:grabbing}
.pth img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.pth.busy img{opacity:.45}
.pth.busy::after{content:"";position:absolute;inset:0;margin:auto;width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:pspin .8s linear infinite}
@keyframes pspin{to{transform:rotate(360deg)}}
.pth.used::before{content:"";position:absolute;left:7px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 8px var(--accent-glow);z-index:1}
.pth .pdel{position:absolute;right:5px;top:5px;width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(20,20,22,.72);backdrop-filter:blur(8px);color:#ff6b6b;display:grid;place-items:center;cursor:pointer;padding:0;opacity:0;transition:opacity .15s}
.pth:hover .pdel,.pth:focus-within .pdel{opacity:1}
.pth .pdel svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.pdrop{border:1.5px dashed var(--line);border-radius:14px;padding:22px 12px;text-align:center;color:var(--muted);font-size:13px}
#poolBox.over .pdrop,#poolBox.over .poolgrid{outline:2px dashed var(--accent);outline-offset:4px;border-radius:14px}
@media (max-width:820px){.poolgrid{grid-template-columns:repeat(4,minmax(0,1fr))} .pth .pdel{opacity:1;width:22px;height:22px;right:4px;top:4px} .pth .pdel svg{width:11px;height:11px}}
.fxrow{display:flex;gap:8px;width:100%}
.fxrow .pill{flex:1;justify-content:center}
.lq{position:fixed;inset:0;z-index:70;background:#0c0c0d;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:16px;animation:fade .2s}
.lq-stage{position:relative;display:grid;place-items:center;min-height:0;overflow:hidden}
.lq-stage canvas{cursor:none;touch-action:none;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lq-brush{position:absolute;display:none;border:1.5px solid #fff;border-radius:50%;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.lq-side{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.lq-side h2{margin:0;font:700 20px var(--display)}
.lq-tools{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.lq-t{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--fg);font:500 13px var(--body);cursor:pointer}
.lq-t svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lq-t[aria-pressed="true"]{background:var(--panel-2);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lq-end{display:flex;gap:8px;margin-top:auto}.lq-end .pill{flex:1;justify-content:center}
@media (max-width:820px){.lq{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;padding:10px;gap:10px}.lq-side{padding:12px;gap:8px}.lq-side h2,.lq-side .hint2{display:none}.lq-tools{grid-template-columns:repeat(4,1fr)}.lq-t{flex-direction:column;justify-content:center;height:54px;gap:2px;font-size:11px;padding:0}.lq-end{margin-top:0}}
.adjust{display:flex;flex-direction:column;gap:8px;width:100%}
.chs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:2px 0 8px}
.chs .pill{height:30px;padding:0;justify-content:center;font-size:12px;gap:6px}
.chs .pill i{width:8px;height:8px;border-radius:50%;display:block}
.arow span{white-space:nowrap}
#histo{width:100%;height:64px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--line);display:block}
#curve{width:100%;aspect-ratio:320/220;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--line);touch-action:none;cursor:ns-resize;display:block}
.bands{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:4px 0 6px}
.bands button{aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;opacity:.75}
.bands button[aria-pressed="true"]{border-color:#fff;opacity:1;box-shadow:0 0 0 2px rgba(0,0,0,.5) inset}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.looks .pill{height:36px;padding:0;justify-content:center;font-size:12.5px}
.looks .pill[aria-pressed="true"]{background:linear-gradient(135deg,rgba(255,200,120,.22),rgba(212,0,0,.26));border-color:rgba(255,200,120,.45);box-shadow:none}
.arow.off{opacity:.4;pointer-events:none}
.atabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.atabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:600 11.5px var(--body);cursor:pointer}
.atabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.atabs button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.apane{display:flex;flex-direction:column;gap:8px}
.agroup{display:flex;flex-direction:column;gap:2px}
.agroup.off{opacity:.35;pointer-events:none}
.astat{margin:0;font-size:12px;color:var(--muted)}
.hairsw{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:4px 0 6px}
.hairsw button{aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.25);cursor:pointer;font:600 10px var(--body);color:var(--fg);background:rgba(255,255,255,.06)}
.hairsw button:hover{outline:2px solid var(--accent);outline-offset:1px}
.adjust .grp{border-top:1px solid var(--line);padding-top:6px}
.adjust summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font:600 12px var(--body);letter-spacing:.06em;color:var(--fg);padding:6px 2px}
.adjust summary::-webkit-details-marker{display:none}
.adjust summary svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;transition:transform .2s}
.adjust summary .gt{flex:1}
.apane > .pill{flex:none}
.grst{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:inherit;display:grid;place-items:center;cursor:pointer;padding:0;margin-right:8px;opacity:.7}
.grst:hover{opacity:1;background:rgba(255,255,255,.14)} .grst:active{transform:scale(.92)}
.grst svg{width:13px;height:13px;transform:none!important}
.adjust details:not([open]) .grst{display:none}
.pill:disabled{opacity:.35;pointer-events:none}
.adjust details:not([open]) summary svg.chev{transform:rotate(-90deg)}
.arow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:3px 2px;font-size:12.5px;color:var(--muted)}
.arow output{font-variant-numeric:tabular-nums;color:var(--fg);font-size:12px;min-width:38px;text-align:right}
.arow input{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:0}
.wheels{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:4px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.wheel b{font-weight:600}
.wheel canvas{width:100%;max-width:84px;aspect-ratio:1;touch-action:none;cursor:crosshair}
.wheel input{width:100%;accent-color:var(--accent)}
#adjAll{margin-top:4px;justify-content:center;height:38px;font-size:12.5px}
.mpane .adjust{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px}

  const byCol = {}; L.cells.forEach(([c,r,cs,rs,label]) => { (byCol[c] = byCol[c] || []).push({r, rs, label}); });
  const cols = Object.keys(byCol).map(Number).sort((a,b)=>a-b), Z = sizesOf(L);

async function drawSheet(W, type='image/png'){

    const r = R[i], p = photos[i];
    g.save(); g.beginPath();

    g.clip(); g.fillStyle=S.fill; g.fillRect(r.x*k, r.y*k, r.w*k, r.h*k);
    if(p){
      let im; if(hasAdj(p.adj)){ try{ im = G ? await gpuRender(p, Math.min(p.w, G.MAX), Math.round(Math.min(p.w, G.MAX)*p.h/p.w)) : await renderAdj(p, true); }catch{ im = null; } }
      if(!im){ im = new Image(); im.src = p.base || p.url; await im.decode(); }
      const b = imgBox(p, r);

      if(p.rot) g.rotate(p.rot*Math.PI/180);
      if(p.flip) g.scale(-1,1);
      g.drawImage(im, -b.w*k/2, -b.h*k/2, b.w*k, b.h*k);
      g.setTransform(1,0,0,1,0,0);
    }
    if(S.labels){
      g.font = `600 ${13*k}px "DM Sans", system-ui, sans-serif`;
      if('letterSpacing' in g) g.letterSpacing = (13*k*.04)+'px';
      g.fillStyle = p ? '#fff' : (lum(S.fill)<.5 ? '#fff' : '#111');
      if(p){ g.shadowColor='rgba(0,0,0,.5)'; g.shadowBlur=6*k; }
      g.textBaseline='alphabetic';
      g.fillText(r.label, (r.x+14)*k, (r.y+r.h-12)*k);
    }

  }

    const shape = () => { g.beginPath();
      if(cv.shape==='circle') g.ellipse(cv.x*k, cv.y*k, cv.w*k/2, cv.h*k/2, 0, 0, Math.PI*2);
      else if(g.roundRect) g.roundRect((cv.x-cv.w/2)*k, (cv.y-cv.h/2)*k, cv.w*k, cv.h*k, S.rad*k); else g.rect((cv.x-cv.w/2)*k, (cv.y-cv.h/2)*k, cv.w*k, cv.h*k); };
    if(cv.color === 'blur'){
      // blur what is under the cover: a copy of the sheet, blurred, drawn inside the shape
      const rad = blurOf(cv)*k, m = rad*3, x0 = Math.max(0,(cv.x-cv.w/2)*k-m), y0 = Math.max(0,(cv.y-cv.h/2)*k-m);
      const w0 = Math.min(c.width-x0, cv.w*k+2*m), h0 = Math.min(c.height-y0, cv.h*k+2*m);

      if('filter' in tg){ tg.filter = `blur(${rad}px)`; tg.drawImage(c, x0, y0, w0, h0, 0, 0, w0, h0); }
      else { const sm = document.createElement('canvas'), f = Math.max(1, rad/2); sm.width = Math.max(1, Math.round(w0/f)); sm.height = Math.max(1, Math.round(h0/f));

      g.save(); shape(); g.clip(); g.drawImage(t, x0, y0); g.restore();

    }

    if(cv.shape==='circle') g.ellipse(cv.x*k, cv.y*k, cv.w*k/2, cv.h*k/2, 0, 0, Math.PI*2);
    else if(g.roundRect) g.roundRect((cv.x-cv.w/2)*k, (cv.y-cv.h/2)*k, cv.w*k, cv.h*k, S.rad*k); else g.rect((cv.x-cv.w/2)*k, (cv.y-cv.h/2)*k, cv.w*k, cv.h*k);

}

          <div class="pcount" title="${sheets.list.length} of ${MAX_SHEETS} projects">${Array.from({length:MAX_SHEETS}, (_, i) => `<i class="${i < sheets.list.length ? 'on' : ''}"></i>`).join('')}<span>${sheets.list.length} of ${MAX_SHEETS}</span></div></div>
        <div class="ptools">
          <label class="psearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="search" id="pQ" placeholder="Search your characters" aria-label="Search your characters" value="${esc(query)}"></label>
          <div class="pseg" role="group" aria-label="Order">${opt('sort', 'recent', 'Recent')}${opt('sort', 'name', 'Name')}${opt('sort', 'made', 'Created')}</div>
          <div class="pseg" role="group" aria-label="View">${opt('view', 'grid', 'Tiles', '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>')}${opt('view', 'list', 'List', '<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/>')}</div>
          <button type="button" class="pill main${full ? ' off' : ''}" id="shNew2" title="${full ? `All ${MAX_SHEETS} places are taken: delete one to make room` : 'A new, empty sheet'}"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="w">New character</span></button>
        </div>
        <div id="pList"></div>
      </div>`;
    m.querySelector('#pQ').oninput = e => { query = e.target.value; paintList(); };
    paintList();
  };
  const draw = async () => {
    urls.forEach(u => URL.revokeObjectURL(u)); urls.length = 0;
    const next = [];
    for(const x of sheets.list){ let u = '';
      if(x.thumb){ try{ const data = await store.get(x.thumb, x.thumbAt || x.updated_at); if(data){ u = URL.createObjectURL(data); urls.push(u); } }catch{} }
      next.push({x, u}); }
    // a card without a thumbnail shows its first photos side by side
    for(const r of next){ if(r.u || !r.x.paths.length) continue; r.strip = [];
      for(const pa of r.x.paths){ try{ const u2 = URL.createObjectURL(await getBlob(pa)); urls.push(u2); r.strip.push(u2); }catch{} } }
    rows = next; paint();
  };
  const close = () => { urls.forEach(u => URL.revokeObjectURL(u)); m.remove(); syncPanel(); };
  const busy = on => m.classList.toggle('busy', on);
  m.onclick = async e => {
    const t = e.target.closest('button');

    if(!t || m.classList.contains('busy')) return;
    if(t.id === 'shOut'){ close(); await save(); await sb.auth.signOut(); return; }
    if(t.dataset.pv){ const [k, v] = t.dataset.pv.split(':'); pv[k] = v; keep(); m.querySelectorAll(`[data-pv^="${k}:"]`).forEach(x => x.setAttribute('aria-pressed', x === t)); paintList(); return; }
    if(t.id === 'shNew' || t.id === 'shNew2'){ if(sheets.list.length >= MAX_SHEETS) return; busy(true); await newSheet(false); busy(false); return close(); }
    if(t.dataset.open){ if(t.dataset.open === sheets.cur) return close(); busy(true); await switchSheet(t.dataset.open); busy(false); return close(); }
    if(t.dataset.dup){ busy(true); if(t.dataset.dup !== sheets.cur) await switchSheet(t.dataset.dup); await newSheet(true); busy(false); return close(); }
    if(t.dataset.ren){ const x = sheets.list.find(y => y.id === t.dataset.ren), row = t.closest('.sh'), b = row.querySelector('.sh-meta');
      b.innerHTML = `<input class="field" style="height:38px;font-size:14px" maxlength="40" value="${esc(x.name)}" aria-label="Sheet name">`;
      const inp = b.querySelector('input'); inp.focus(); inp.select(); let done = false;
      const finish = async () => { if(done) return; done = true; x.name = inp.value.trim() || x.name;
        await sb.from('roarref_sheets').update({name:x.name}).eq('id', x.id); await draw(); syncPanel(); };
      inp.onkeydown = ev => { if(ev.key==='Enter') finish(); if(ev.key==='Escape'){ done = true; draw(); } }; inp.onblur = finish; return; }
    if(t.dataset.del){ const row = t.closest('.sh');
      row.querySelector('.sh-acts').innerHTML = `<button type="button" class="pill" data-keep="1">Keep</button><button type="button" class="pill main" data-sure="${t.dataset.del}">Delete</button>`; return; }
    if(t.dataset.keep) return draw();
    if(t.dataset.sure){ busy(true); await deleteSheet(t.dataset.sure); await draw(); busy(false); syncPanel(); }
  };
  const esc2 = e => { if(e.key === 'Escape' && sheets.cur && document.body.contains(m) && !m.querySelector('input')){ document.removeEventListener('keydown', esc2); close(); } };
  document.addEventListener('keydown', esc2);
  await draw(); document.body.appendChild(m); m.scrollTop = 0;
}

/* the door: RoarRef opens only with a Roar Account (sign in, create one, or the 6-digit code of two-step verification) */
let gateMode = 'in', mfaFactor = null;
function drawGate(msg, err){
  const g = $('gate'); g.hidden = false;
  const keepEmail = $('gEmail') ? $('gEmail').value : '';
  const T = {in:['Sign in to RoarRef','Use your Roar Account: the same one as RoarMe, RoarWriter and every Roar app. Your sheets, up to 10, wait for you on any computer.'],
    up:['Create your Roar Account','Free. One account for RoarRef and every Roar app.'], mfa:['One more step','Type the 6-digit code from your authenticator app.']}[gateMode];
  g.innerHTML = `<form class="card gate-card" id="gateForm" novalidate>
    <div class="mark">Roar<b>Ref</b></div><h2>${T[0]}</h2><p>${T[1]}</p>
    ${gateMode==='mfa' ? `<input class="field" id="gCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="123 456" aria-label="Code">`
      : `<input class="field" id="gEmail" type="email" autocomplete="email" placeholder="Email" aria-label="Email">
         <input class="field" id="gPass" type="password" autocomplete="${gateMode==='up'?'new-password':'current-password'}" placeholder="Password${gateMode==='up'?' (at least 8 characters)':''}" aria-label="Password">`}
    ${msg ? `<p class="${err?'gerr':'gnote'}">${esc(msg)}</p>` : ''}
    <button type="submit" class="pill main" id="gGo">${gateMode==='up' ? 'Create account' : gateMode==='mfa' ? 'Verify' : 'Sign in'}</button>
    <div class="row" style="justify-content:center">${gateMode==='in'
      ? `<button type="button" class="pill" data-g="up">Create an account</button><a class="pill" href="../../../account/" target="_blank" rel="noopener">Forgot password?</a>`
      : `<button type="button" class="pill" data-g="in">I have an account</button>`}</div>
  </form>`;
  const f = $('gateForm');
  if($('gEmail') && keepEmail) $('gEmail').value = keepEmail;
  f.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { gateMode = b.dataset.g; drawGate(); });
  f.onsubmit = async e => { e.preventDefault(); const go = $('gGo'); go.disabled = true;
    try{
      if(gateMode==='mfa'){
        const { error } = await sb.auth.mfa.challengeAndVerify({factorId:mfaFactor, code:($('gCode').value||'').replace(/\s/g,'')});
        if(error) return drawGate('Wrong code. Try the next one.', true);
        return afterSignIn();
      }
      const email = ($('gEmail').value||'').trim(), password = $('gPass').value||'';
      if(!email || !password) return drawGate('Type your email and password.', true);
      if(gateMode==='up'){
        if(password.length < 8) return drawGate('The password needs at least 8 characters.', true);
        const { data, error } = await sb.auth.signUp({email, password, options:{emailRedirectTo:'https://themadlions.com/lab/roarref/app/'}});
        if(error) return drawGate(error.message, true);
        if(data.session) return afterSignIn();
        gateMode = 'in'; return drawGate('Almost there: open the link we sent to your email, then sign in here.');
      }
      const { error } = await sb.auth.signInWithPassword({email, password});
      if(error) return drawGate('Wrong email or password.', true);
      afterSignIn();
    } finally { const b = $('gGo'); if(b) b.disabled = false; }
  };
  setTimeout(() => { const i = $('gCode') || ($('gEmail') && $('gEmail').value ? $('gPass') : $('gEmail')); if(i) i.focus(); }, 30);
}
async function afterSignIn(){
  const aal = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(aal.data && aal.data.nextLevel === 'aal2' && aal.data.currentLevel !== 'aal2'){
    const f = await sb.auth.mfa.listFactors(); const t = f.data && f.data.totp && f.data.totp.find(x => x.status === 'verified');
    if(t){ mfaFactor = t.id; gateMode = 'mfa'; return drawGate(); }
  }
  const { data } = await sb.auth.getUser(); me = data.user;
  if(me) start(); else { gateMode = 'in'; drawGate(); }
}
async function restore(){
  if(!sb){ $('gate').hidden = false; $('gate').innerHTML = '<div class="card gate-card"><div class="mark">Roar<b>Ref</b></div><h2>RoarRef could not start</h2><p>The sign-in could not load. Check the connection and reload the page.</p></div>'; return; }
  const { data } = await sb.auth.getSession();
  if(data.session) afterSignIn(); else drawGate();
  sb.auth.onAuthStateChange((ev) => { if(ev === 'SIGNED_OUT'){ me = null; sheets = {cur:null, list:[]}; photos = []; render(); gateMode = 'in'; drawGate(); } });
}
/* where each control lives: on a computer the top bar and the bar under the sheet, on a phone the top row and the tabs */
const isPhone = () => matchMedia('(max-width:820px)').matches;
let mTab = 'layout';
function moveLens2(){ const b = $('mtabs').querySelector(`[data-t="${mTab}"]`); if(!b) return;
  $('mlens').style.left = b.offsetLeft+'px'; $('mlens').style.width = b.offsetWidth+'px';
  $('mtabs').querySelectorAll('.lay').forEach(x => x.setAttribute('aria-selected', x===b)); }
function fillMTools(){ // the picked window's buttons, in the Window tab on a phone
  const tr = $('mtools'); if(!tr) return; tr.innerHTML = '';
  if(sel >= 0 && sel < rects(lay(), S.gap, pad()).length){ const t = toolbar(sel); tr.append(...t.childNodes); }
  else { const h = document.createElement('p'); h.className='hint2'; h.style.flex='1'; h.textContent = isPhone() ? 'Tap a window on the sheet to work on it.' : 'Click a window on the sheet to work on it.'; tr.appendChild(h); }
}
const RAIL = [['pool','Pool','<rect x="3" y="7" width="13" height="13" rx="2"/><path d="M7 7V5a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-2M3 16l4-4 4 4 2-2 3 3"/>'],
  ['layout','Layout','<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v14M15 5v14"/>'],
  ['look','Look','<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/>'],
  ['frame','Frame','<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>'],
  ['edit','Edit','<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>'],
  ['face','Face','<circle cx="12" cy="11" r="7"/><path d="M9 10h.01M15 10h.01M9.5 14c1.5 1.2 3.5 1.2 5 0"/>'],
  ['body','Body','<path d="M9 3c-1 4 1 6 0 9s-1 6 0 9M15 3c1 4-1 6 0 9s1 6 0 9M7 12h3M14 12h3"/>'],
  ['hair','Hair','<path d="M5 20c-1-6 0-14 7-14s8 8 7 14M8 12c2-1 5-3 6-6"/>']];
let railTab = 'layout'; try{ const r0 = localStorage.getItem('roarref-rail'); if(RAIL.some(x => x[0] === r0)) railTab = r0; }catch{}
function placeControls(){
  const bar = document.querySelector('.bar'), mark = bar.querySelector('.mark'), stash = $('stash');
  // everything back to the stash first, then out to where this screen wants it
  ['layouts','ratios','stack','sheetSw','fillSw','cover','labels','sheetsBtn','add','clear','export','gapCtl','radCtl','even','poolBox'].forEach(id => stash.appendChild($(id)));
  ['zoom','pw','ph','x','y','rot','adjust'].forEach(k => stash.appendChild(document.querySelector(`[data-k="${k}"]`)));
  $('mpane').innerHTML = ''; $('side').innerHTML = ''; $('rail').innerHTML = '';
  const lb = $('labels'), cv = $('cover');
  [lb, cv].forEach(x => { x.classList.add('wide'); x.classList.remove('round'); });
  if(!lb.querySelector('.w')) lb.insertAdjacentHTML('beforeend','<span class="w">Names</span>');
  const sp = document.createElement('span'); sp.className = 'spacer';
  // the top row as a program's: Home, the name, then what is done to the sheet in three small groups (history, photos, export)
  let pn = $('projName'); if(!pn){ pn = document.createElement('span'); pn.id = 'projName'; pn.className = 'bname'; const c0 = curSheet(); pn.textContent = c0 ? c0.name : ''; }
  const sepEl = () => { const i = document.createElement('i'); i.className = 'bsep'; return i; };
  [$('add'), $('clear'), $('sheetsBtn')].forEach(x => { x.classList.toggle('round', isPhone()); });
  $('add').style.marginLeft = '';
  bar.replaceChildren($('sheetsBtn'), mark, pn, sp, $('undo'), $('redo'), sepEl(), $('add'), $('clear'), sepEl(), $('export'));
  const mk = (parent, cls) => (...els) => { const r = document.createElement('div'); r.className = cls; els.filter(Boolean).forEach(e => r.appendChild(e)); parent.appendChild(r); return r; };
  if(isPhone()){
    const row = mk($('mpane'), 'mrow');
    if(mTab==='pool'){ row($('poolBox')); drawPool(); }
    else if(mTab==='layout'){ row($('layouts')); row($('ratios'), $('stack'), $('even')); }
    else if(mTab==='look'){ row($('sheetSw'), $('fillSw')); row($('gapCtl')); row($('radCtl')); row(lb, cv); }
    else { const tr = row(); tr.id = 'mtools'; ['zoom','pw','ph','x','y','rot'].forEach(k => row(document.querySelector(`[data-k="${k}"]`)));
      const h = document.createElement('p'); h.className = 'sub'; h.textContent = 'Adjust'; $('mpane').appendChild(h);
      row(document.querySelector('[data-k="adjust"]')); }
    requestAnimationFrame(moveLens2);
  } else {
    const side = $('side'), rail = $('rail'), PHOTO = ['frame','edit','face','body','hair'];
    rail.innerHTML = RAIL.map(([k, l, ic], i) => (i === 3 ? '<hr>' : '') + `<button type="button" data-rail="${k}" aria-pressed="${k===railTab}" title="${l}"><svg viewBox="0 0 24 24">${ic}</svg>${l}</button>`).join('');
    rail.onclick = e => { const b2 = e.target.closest('[data-rail]'); if(!b2) return; railTab = b2.dataset.rail; try{ localStorage.setItem('roarref-rail', railTab); }catch{} placeControls(); };
    const s2 = document.createElement('section'); s2.className = 'sec'; side.appendChild(s2);
    s2.innerHTML = `<h2 class="ptl">${RAIL.find(x => x[0] === railTab)[1]}</h2>` + (PHOTO.includes(railTab) && railTab !== 'frame' ? '<p class="hint2" id="needPhoto">Click a photo on the sheet to work on it.</p>' : '');
    const row = mk(s2, 'srow');
    const lab = t => { const h = document.createElement('p'); h.className = 'plab'; h.textContent = t; s2.appendChild(h); };
    [$('stack'), $('even')].forEach(x => { x.classList.remove('wide'); x.classList.add('round'); });
    if(railTab === 'pool'){ row($('poolBox')); drawPool(); }
    else if(railTab === 'layout'){ // three groups, each with its name: the windows, the shape of the sheet, how they sit
      lab('Windows'); row($('layouts')); lab('Sheet shape'); row($('ratios')); lab('Arrange');
      const st = $('stack'), ev = $('even'); [[st, 'Stacked'], [ev, 'Even sizes']].forEach(([x, w]) => { x.classList.add('wide'); x.classList.remove('round'); if(!x.querySelector('.w')) x.insertAdjacentHTML('beforeend', `<span class="w">${w}</span>`); });
      row(st, ev); }
    else if(railTab === 'look'){ lab('Colours'); row($('sheetSw')); row($('fillSw')); lab('Spacing'); row($('gapCtl')); row($('radCtl')); lab('On the sheet'); row(lb, cv); }
    else if(railTab === 'frame'){ const K = k => document.querySelector(`[data-k="${k}"]`); lab('Window'); const tr = row(); tr.id = 'mtools';
      lab('Size'); ['zoom','pw','ph'].forEach(k => row(K(k))); lab('Position'); ['x','y','rot'].forEach(k => row(K(k))); }
    else { const box = document.querySelector('[data-k="adjust"]'); row(box); box.show(railTab); }
  }
  fillMTools();
  moveLens(); moveRatioLens(); fit();
}
$('mtabs').onclick = e => { const b = e.target.closest('[data-t]'); if(!b) return; mTab = b.dataset.t; placeControls(); };
matchMedia('(max-width:820px)').addEventListener('change', placeControls);
buildPanel(); render(); placeControls(); restore();
</script>
