<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- RoarRef (Alex, 6 Nov 2026): a 16:9 character reference sheet for AI. Fixed windows in 2 to 8 panel layouts; photos are
     dropped in, moved and zoomed inside their window; Export writes a 3840x2160 PNG. Plain HTML, CSS and JS, everything stays
     in this browser (IndexedDB 'roarref'). Its small page is lab/roarref/ (Lab experiment 10); also in Studio > Apps > In the browser. -->
<title>RoarRef · Character sheet for AI</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141415">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: one top row with every control, the 16:9 sheet filling the rest of the screen. Roar graphite glass, red that glows. */
:root{
  --bg:#141415; --panel:rgba(255,255,255,.055); --panel-2:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.09); --fg:#ececea; --muted:#9a9a97;
  --accent:#d40000; --accent-glow:rgba(212,0,0,.45);
  --display:"Jost",system-ui,sans-serif; --body:"DM Sans",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;overflow:hidden;
  background-image:radial-gradient(1200px 600px at 50% -10%,rgba(255,255,255,.05),transparent 60%)}
.app{height:100%;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mark{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em;white-space:nowrap}
.mark b{color:var(--accent);text-shadow:0 0 14px var(--accent-glow);font-weight:700}
.group{display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:var(--panel);
  border:1px solid var(--line);backdrop-filter:blur(14px);position:relative}
.lens{position:absolute;top:4px;height:calc(100% - 8px);border-radius:999px;background:var(--panel-2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 10px rgba(0,0,0,.35);transition:left .28s cubic-bezier(.3,.8,.3,1),width .28s;pointer-events:none}
.lay{position:relative;z-index:1;border:0;background:transparent;width:32px;flex:none;height:32px;border-radius:999px;cursor:pointer;
  display:grid;place-items:center;color:var(--muted);transition:color .2s}
.lay:hover,.lay[aria-pressed="true"]{color:var(--fg)}
.lay svg{width:26px;height:15px}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 13px var(--body);height:40px;padding:0 16px;
  border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;backdrop-filter:blur(14px);white-space:nowrap;
  transition:background .2s,transform .12s,box-shadow .2s}
.pill:hover{background:var(--panel-2)}
.pill:active{transform:scale(.96)}
.pill.main{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 0 22px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.25)}
.pill.main:hover{background:#e60a0a}
.pill[aria-pressed="true"]{background:var(--panel-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.pill svg,.ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ctl{display:flex;align-items:center;gap:7px;height:40px;padding:0 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
  font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ctl input[type=range]{width:56px;accent-color:var(--accent)}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.sw.pick{position:relative;overflow:hidden;background:conic-gradient(#f44,#fd4,#4f6,#4cf,#64f,#f4c,#f44)}
.sw.pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.spacer{flex:1;margin-left:-8px}
.pill.round{width:40px;padding:0;justify-content:center}
.pill.round .w{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stagewrap{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.stage{position:relative;max-width:100%;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px var(--line);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none}
.frame{position:absolute;overflow:hidden;cursor:pointer;outline:0}
.frame.has{cursor:grab}
.frame.drag{cursor:grabbing}
.frame img{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}
.frame .empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;
  color:rgba(0,0,0,.42);font-size:max(10px,calc(var(--k)*13px));letter-spacing:.02em;font-weight:600;
  border:calc(var(--k)*2px) dashed rgba(0,0,0,.16);border-radius:inherit;box-sizing:border-box}
.dark .frame .empty{color:rgba(255,255,255,.45);border-color:rgba(255,255,255,.18)}
.frame .empty svg{width:max(20px,calc(var(--k)*30px));height:max(20px,calc(var(--k)*30px));stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.frame .empty small{font-weight:400;text-transform:none;letter-spacing:0;opacity:.8;font-size:max(9px,calc(var(--k)*12px))}
.frame.over::after,.frame.sel::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.frame.sel::after{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 18px var(--accent-glow)}
.frame.over::after{box-shadow:inset 0 0 0 3px var(--accent);background:rgba(212,0,0,.12)}
.split{position:absolute;z-index:4;touch-action:none}
.split.v{width:18px;margin-left:-9px;cursor:col-resize}
.split.h{height:18px;margin-top:-9px;cursor:row-resize}
.split::after{content:"";position:absolute;border-radius:99px;background:rgba(255,255,255,.92);box-shadow:0 0 0 1px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.3);opacity:0;transition:opacity .2s}
.split.v::after{left:7px;width:4px;top:50%;height:46px;margin-top:-23px}
.split.h::after{top:7px;height:4px;left:50%;width:46px;margin-left:-23px}
.stage:hover .split::after{opacity:.55}
.split:hover::after,.split.on::after{opacity:1;background:var(--accent);box-shadow:0 0 14px var(--accent-glow)}
.cover{position:absolute;z-index:6;cursor:move;touch-action:none;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.cover.sel{outline:2px solid var(--accent);outline-offset:3px}
.cover .rs{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--accent);cursor:nwse-resize}
.cover .tools{bottom:auto;top:-52px;white-space:nowrap}
.cover .tools .ico[aria-pressed="true"]{background:rgba(255,255,255,.22)}
.cover .tools .sw{width:24px;height:24px;flex:none;align-self:center;margin:0 2px}
.label{position:absolute;left:calc(var(--k)*14px);bottom:calc(var(--k)*12px);font:600 calc(var(--k)*13px)/1 var(--body);letter-spacing:.04em;
  pointer-events:none}
.tools{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:999px;
  background:rgba(20,20,22,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(16px);z-index:5;cursor:default}
.ico{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.06);color:#eee;cursor:pointer;display:grid;place-items:center;
  transition:background .2s,transform .12s}
.ico:hover{background:rgba(255,255,255,.16)}
.ico:active{transform:scale(.92)}
.ico.del{color:#ff6b6b}
.ico.del:hover{background:rgba(212,0,0,.3);color:#fff}
.panel{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;min-height:40px}
.panel .ctl input[type=range]{width:80px}
.panel .ctl.big input[type=range]{width:96px}
.panel .ctl{gap:6px;padding:0 10px}
.panel .ctl output{min-width:36px}
.lay.rt{width:auto;padding:0 8px;font:600 12px var(--body);letter-spacing:.02em}
.panel .ctl output{min-width:42px;text-align:right;font-variant-numeric:tabular-nums;color:var(--fg);letter-spacing:0;text-transform:none}
.panel .off{opacity:.4;pointer-events:none}
.panel .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.tools .ico{width:34px;height:34px}
.frame .tools{max-width:calc(100% - 8px);flex-wrap:wrap;justify-content:center;border-radius:20px}
.card .pill[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 16px var(--accent-glow)}
.ghost{position:fixed;z-index:80;width:84px;height:84px;object-fit:cover;border-radius:14px;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg);
  box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 0 2px var(--accent);opacity:.92}
.field{height:46px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--fg);padding:0 18px;font:500 16px var(--body);outline:0}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.hint{position:absolute;bottom:-2px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .2s}
.card{background:rgba(32,32,34,.92);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:min(980px,100%);width:100%;
  display:flex;flex-direction:column;gap:14px;animation:pop .28s cubic-bezier(.3,1.4,.5,1);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.card h2{margin:0;font:700 20px var(--display)}
.card img{width:100%;border-radius:10px;display:block}
.card p{margin:0;color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@keyframes pop{from{transform:scale(.94);opacity:0}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(30,30,32,.95);border:1px solid var(--line);
  padding:10px 18px;border-radius:999px;font-size:13px;z-index:60;animation:fade .2s}
@media (max-width:820px){
  #layouts{max-width:100%;overflow-x:auto;scrollbar-width:none}
  .stagewrap{align-items:start}
  .ctl input[type=range]{width:60px}
  .pill .w{display:none}
  .pill{padding:0 12px}
  .tools{bottom:4px}
  .ico{width:30px;height:30px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="app">
  <div class="bar">
    <a class="mark" href="../" title="About RoarRef" style="color:inherit;text-decoration:none">Roar<b>Ref</b></a>
    <div class="group" id="layouts" role="group" aria-label="Layout"><span class="lens" id="lens"></span></div>
    <div class="group" id="ratios" role="group" aria-label="Shape of the sheet"><span class="lens" id="rlens"></span></div>
    <button class="pill round" id="stack" aria-pressed="false" title="Windows side by side or stacked one under the other">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="7" rx="1.5"/><rect x="4" y="13" width="16" height="7" rx="1.5"/></svg></button>
    <div class="ctl" id="sheetSw" title="Sheet colour">Sheet</div>
    <div class="ctl" id="fillSw" title="Colour behind the photos">Fill</div>
    <button class="pill round" id="cover" title="Add a shape to cover a face">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="5" fill="currentColor"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span class="w">Cover</span></button>
    <button class="pill round" id="labels" aria-pressed="false" title="Show the view names on the sheet">
      <svg viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></svg><span class="w">Labels</span></button>
    <button class="pill round" id="add" style="margin-left:auto" title="Add photos to the empty windows">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="w">Add photos</span></button>
    <button class="pill round" id="clear" title="Empty every window">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span class="w">Clear</span></button>
    <button class="pill main" id="export" title="Save the sheet as PNG or JPEG, 4K to 8K">
      <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="w">Export</span></button>
  </div>
  <div class="stagewrap" id="wrap">
    <div class="stage" id="stage"></div>
  </div>
  <div class="panel" id="panel"></div>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>

<script>
// the sheet in its own units: 1600 on its long side, the other as the shape asks (16:9, 1:1, 2:1, 9:16)
const RATIOS = [['16:9',16/9],['1:1',1],['2:1',2],['9:16',9/16]];
let BW = 1600, BH = 900;
function setShape(){ const r = (RATIOS.find(x => x[0]===S.ratio) || RATIOS[0])[1]; if(r >= 1){ BW = 1600; BH = Math.round(1600/r); } else { BH = 1600; BW = Math.round(1600*r); } }
const LAYOUTS = [
  {id:'t3', name:'Front, back, face', cols:[1,1,1], rows:[1], cells:[[0,0,1,1,'Front'],[1,0,1,1,'Back'],[2,0,1,1,'Face']]},
  {id:'t4', name:'Front, side, back, face', cols:[1,1,1,1], rows:[1], cells:[[0,0,1,1,'Front'],[1,0,1,1,'Side'],[2,0,1,1,'Back'],[3,0,1,1,'Face']]},
  {id:'t5', name:'Five views', cols:[1,1,1,1,1.25], rows:[1], cells:[[0,0,1,1,'Front'],[1,0,1,1,'3/4'],[2,0,1,1,'Side'],[3,0,1,1,'Back'],[4,0,1,1,'Face']]},
  {id:'t6', name:'Six in a row', cols:[1,1,1,1,1,1], rows:[1], cells:[[0,0,1,1,'Front'],[1,0,1,1,'3/4 left'],[2,0,1,1,'Side'],[3,0,1,1,'Back'],[4,0,1,1,'3/4 right'],[5,0,1,1,'Face']]},
  {id:'bf', name:'Three bodies, two faces', cols:[1,1,1,1.1], rows:[1,1], cells:[[0,0,1,2,'Front'],[1,0,1,2,'Side'],[2,0,1,2,'Back'],[3,0,1,1,'Face'],[3,1,1,1,'Profile']]},
  {id:'b6', name:'Two bodies, six faces', cols:[1,1,1,1,1], rows:[1,1], cells:[[0,0,1,2,'Front'],[1,0,1,2,'Back'],[2,0,1,1,'Neutral'],[3,0,1,1,'Smile'],[4,0,1,1,'Angry'],[2,1,1,1,'Sad'],[3,1,1,1,'Surprised'],[4,1,1,1,'Profile']]},
  {id:'h4', name:'Hero and four', cols:[2,1,1], rows:[1,1], cells:[[0,0,1,2,'Hero'],[1,0,1,1,'Front'],[2,0,1,1,'Back'],[1,1,1,1,'Face'],[2,1,1,1,'Detail']]},
  {id:'e6', name:'Six expressions', cols:[1,1,1], rows:[1,1], cells:[[0,0,1,1,'Neutral'],[1,0,1,1,'Smile'],[2,0,1,1,'Angry'],[0,1,1,1,'Sad'],[1,1,1,1,'Surprised'],[2,1,1,1,'Profile']]},
  {id:'s2', name:'Body and face', cols:[1,1], rows:[1], cells:[[0,0,1,1,'Body'],[1,0,1,1,'Face']]},
];
const SHEET_COLORS = ['#ffffff','#8b8b88','#000000'];
const FILL_COLORS = ['#ededeb','#ffffff','#2a2a2a'];

let S = {layout:'t3', ratio:'16:9', gap:14, rad:0, sheet:'#ffffff', fill:'#ededeb', labels:false, sizes:{}, covers:[]};
let photos = [];   // index -> {url, blob, w, h, s, ox, oy, flip}
let sel = -1;

const $ = id => document.getElementById(id);
const stage = $('stage'), wrap = $('wrap');
// stacked (Alex, 6 Nov: "in 9:16 put them horizontal too"): the same layout turned, its columns become rows
const turn = L => ({id: L.id+'~t', name: L.name, cols: L.rows, rows: L.cols, cells: L.cells.map(([c,r,cs,rs,label]) => [r,c,rs,cs,label])});
const shaped = L => S.stack ? turn(L) : L;
const lay = () => S.layout==='custom' && S.custom ? {id:'custom', name:'Your layout', tree:S.custom} : shaped(LAYOUTS.find(l => l.id === S.layout) || LAYOUTS[0]);

/* your own layout (Alex, 6 Nov: "or let me add"): a tree of windows. A box {d:'x'|'y', k:[...], f:[...]} lays its children
   side by side (x) or one under the other (y), f their shares; a leaf {label} is one window. Windows are numbered in reading
   order of the tree, which is the order of photos[]. */
function toTree(L){ // a preset as a tree: its columns, each one its rows (or the turned way round)
  const byCol = {}; L.cells.forEach(([c,r,cs,rs,label]) => { (byCol[c] = byCol[c] || []).push({r, rs, label}); });
  const cols = Object.keys(byCol).map(Number).sort((a,b)=>a-b), Z = sizesOf(L);
  const kid = c => { const cells = byCol[c].sort((a,b)=>a.r-b.r);
    if(cells.length===1) return {label:cells[0].label};
    return {d:'y', k:cells.map(x=>({label:x.label})), f:cells.map(x=>Z.rows.slice(x.r,x.r+x.rs).reduce((a,b)=>a+b,0))}; };
  return {d:'x', k:cols.map(kid), f:cols.map(c=>Z.cols[c])};
}
function leaves(n, out=[]){ if(n.k) n.k.forEach(c=>leaves(c,out)); else out.push(n); return out; }
function treeRects(n, x, y, w, h, out=[], gap=S.gap){
  if(!n.k){ out.push({x, y, w, h, label:n.label||'View'}); return out; }
  const tot = n.f.reduce((a,b)=>a+b,0), inner = (n.d==='x' ? w : h) - (n.k.length-1)*gap; let at = n.d==='x' ? x : y;
  n.k.forEach((c,j) => { const len = n.f[j]/tot*inner;
    if(n.d==='x') treeRects(c, at, y, len, h, out, gap); else treeRects(c, x, at, w, len, out, gap); at += len + gap; });
  return out;
}
function treeCuts(n, x, y, w, h, out=[]){ // every line inside the tree, with what it moves
  if(!n.k) return out;
  const tot = n.f.reduce((a,b)=>a+b,0), inner = (n.d==='x' ? w : h) - (n.k.length-1)*S.gap; let at = n.d==='x' ? x : y;
  n.k.forEach((c,j) => { const len = n.f[j]/tot*inner;
    if(n.d==='x') treeCuts(c, at, y, len, h, out); else treeCuts(c, x, at, w, len, out);
    at += len;
    if(j < n.k.length-1) out.push({node:n, j, axis: n.d==='x' ? 'cols' : 'rows', at: at + S.gap/2, inner, from: n.d==='x' ? y : x, to: n.d==='x' ? y+h : x+w});
    at += S.gap; });
  return out;
}
function parentOf(n, target){ if(!n.k) return null; for(const c of n.k){ if(c===target) return n; const p = parentOf(c, target); if(p) return p; } return null; }
function makeCustom(){ if(S.layout!=='custom' || !S.custom){ S.custom = toTree(lay()); S.layout = 'custom'; } }
function splitWindow(i, d){ // d 'x' side by side, 'y' one under the other
  makeCustom();
  const n0 = leaves(S.custom).length; while(photos.length < n0) photos.push(null);
  const leaf = leaves(S.custom)[i], par = parentOf(S.custom, leaf), fresh = {label:'View'};
  if(par && par.d===d){ const j = par.k.indexOf(leaf), half = par.f[j]/2; par.k.splice(j+1,0,fresh); par.f.splice(j,1,half,half); }
  else { const box = {d, k:[leaf, fresh], f:[1,1]};
    if(!par) S.custom = box; else { const j = par.k.indexOf(leaf); par.k[j] = box; } }
  photos.splice(i+1, 0, null); sel = i; render(); save();
}
function removeWindow(i){
  makeCustom();
  const all = leaves(S.custom); if(all.length < 2) return;
  while(photos.length < all.length) photos.push(null);
  const leaf = all[i], par = parentOf(S.custom, leaf), j = par.k.indexOf(leaf);
  par.k.splice(j,1); par.f.splice(j,1);
  if(par.k.length===1){ const only = par.k[0], gp = parentOf(S.custom, par);
    if(!gp) S.custom = only.k ? only : {d:'x', k:[only], f:[1]}; else gp.k[gp.k.indexOf(par)] = only; }
  photos.splice(i,1); sel = -1; render(); save();
}

// the windows' widths and heights: the layout's own, or what was dragged on the lines between them (S.sizes[layout])
const sizesOf = L => { const z = (S.sizes||{})[L.id] || {}; return {
  cols: z.cols && z.cols.length===L.cols.length ? z.cols : L.cols, rows: z.rows && z.rows.length===L.rows.length ? z.rows : L.rows }; };
// a window's own name (Alex, 7 Nov): presets keep theirs in S.names[layout id][i]; your own layout keeps it in its leaf

  const ghost = document.createElement('img'); ghost.src = p.url; ghost.className = 'ghost'; document.body.appendChild(ghost);
  let target = -1;
  const at = ev => { ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
    const el = document.elementsFromPoint(ev.clientX, ev.clientY).find(x => x.classList && x.classList.contains('frame'));
    const j = el ? +el.dataset.i : -1; target = j === i ? -1 : j; setOver(target >= 0 ? frameEl(target) : null); };
  at(e);
  const move = ev => at(ev);
  const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
    ghost.remove(); setOver(null);
    if(target >= 0){ const n = rects(lay(), S.gap, pad()).length; while(photos.length < n) photos.push(null);
      [photos[i], photos[target]] = [photos[target], photos[i]];
      [photos[i], photos[target]].forEach(q => { if(q){ q.ox = 0; q.oy = 0; } });
      sel = target; render(); save(); toast(photos[i] ? 'Swapped' : 'Moved'); } };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
}
/* name a window: the name shows in the empty window and, with T on, on the sheet and in the export */
function renameWindow(i){
  const L = lay(), cur = rects(L, S.gap, pad())[i].label;
  const m = document.createElement('div'); m.className='modal';
  m.innerHTML = `<form class="card" style="max-width:420px"><h2>Name this window</h2>
    <input id="winName" class="field" maxlength="40" autocomplete="off" aria-label="Window name">
    <p>The name goes on the sheet when the T (names) button is on.</p>
    <div class="row"><span style="flex:1"></span><button type="button" class="pill" id="nNo">Cancel</button><button type="submit" class="pill main">Save</button></div></form>`;
  const inp = m.querySelector('#winName'); inp.value = cur;
  const close = () => m.remove();
  m.onclick = e => { if(e.target===m || e.target.id==='nNo') close(); };
  m.querySelector('form').onsubmit = e => { e.preventDefault();
    const v = inp.value.trim() || cur;
    if(L.tree){ leaves(S.custom)[i].label = v; }
    else { S.names = S.names || {}; S.names[L.id] = Object.assign({}, S.names[L.id], {[i]: v}); }
    S.labels = true; close(); render(); save(); };
  document.body.appendChild(m); setTimeout(() => { inp.focus(); inp.select(); }, 30);
}
function toolbar(i){
  const t = document.createElement('div'); t.className='tools'; t.onpointerdown = e => e.stopPropagation();
  const many = rects(lay(), S.gap, pad()).length > 1;
  t.append(pbtn('splitx','Split this window side by side', ()=>splitWindow(i,'x')),
    pbtn('splity','Split this window top and bottom', ()=>splitWindow(i,'y')));
  if(many) t.append(pbtn('minusw','Remove this window', ()=>removeWindow(i)));
  t.append(pbtn('pen','Name this window', ()=>renameWindow(i)));
  if(!photos[i]){ t.append(pbtn('plus','Add a photo', ()=>{ pickTarget=i; $('file').click(); })); return t; }
  const mv = pbtn('move','Drag onto another window to swap the photos', ()=>{}); mv.style.cursor='grab';
  mv.onpointerdown = e => { e.stopPropagation(); e.preventDefault(); startSwap(i, e); }; t.append(mv);
  const sp = document.createElement('span'); sp.style.cssText='width:1px;background:rgba(255,255,255,.18);margin:4px 2px'; t.append(sp);
  t.append(
    pbtn('fill','Fill the window (reset the photo)', ()=>{ reset(photos[i]); place(i); save(); }),
    pbtn('fit','Show the whole photo', ()=>{ const p=photos[i], r=rects(lay(),S.gap,pad())[i];
      p.s = Math.min(r.w/p.w, r.h/p.h)/Math.max(r.w/p.w, r.h/p.h); p.ox=0; p.oy=0; place(i); save(); }),
    pbtn('flip','Mirror', ()=>{ photos[i].flip=!photos[i].flip; place(i); save(); }),
    pbtn('swap','Replace photo', ()=>{ pickTarget=i; $('file').click(); }),
    pbtn('trash','Remove photo', ()=>{ photos[i]=null; render(); save(); }, 'del'));
  return t;
}
function syncPanel(){
  const p = sel>=0 ? photos[sel] : null, on = !!p;
  const g = $('gap'), rd = $('rad');
  if(g){ g.value = S.gap; g.nextElementSibling.textContent = S.gap; rd.value = S.rad; rd.nextElementSibling.textContent = S.rad; }
  $('even').classList.toggle('off', !(S.layout==='custom' || (S.sizes && S.sizes[lay().id])));
  panelEl.querySelectorAll('#photoCtl > *').forEach(x => x.classList.toggle('off', !on));
  const r = on ? rects(lay(), S.gap, pad())[sel] : {w:800,h:450};
  const set = (k, v, min, max, txt) => { const w = panelEl.querySelector(`[data-k="${k}"]`), i = w.querySelector('input');
    if(min!=null){ i.min = min; i.max = max; } i.value = v; w.querySelector('output').textContent = txt; };
  set('zoom', on ? Math.round(Math.log(p.s)*100) : 0, null, null, on ? Math.round(p.s*100)+'%' : '');
  set('x', on ? Math.round(p.ox) : 0, -Math.round(r.w), Math.round(r.w), on ? Math.round(p.ox/r.w*100)+'%' : '');
  set('y', on ? Math.round(p.oy) : 0, -Math.round(r.h), Math.round(r.h), on ? Math.round(p.oy/r.h*100)+'%' : '');
  set('rot', on ? Math.round(p.rot||0) : 0, null, null, on ? Math.round(p.rot||0)+'°' : '');
}
function zoomBy(i, f, cx=0, cy=0){
  const p = photos[i]; if(!p) return;
  const s2 = Math.min(10, Math.max(.15, p.s*f)); f = s2/p.s;
  p.ox = cx - (cx-p.ox)*f; p.oy = cy - (cy-p.oy)*f; p.s = s2;
  place(i); saveSoon();
}

/* ---------- moving and zooming inside a window ---------- */
const ptrs = new Map(); let gesture = null;
const unit = () => BW / stage.clientWidth;
function localPt(i, e){ // pointer relative to the window centre, in sheet units
  const b = frameEl(i).getBoundingClientRect(), k = unit();
  return {x:(e.clientX-b.left-b.width/2)*k, y:(e.clientY-b.top-b.height/2)*k};
}
stage.addEventListener('pointerdown', e => {
  const f = e.target.closest('.frame'); if(!f) return;
  const i = +f.dataset.i; selCover = -1;
  if(!photos[i]){ if(sel===i){ pickTarget=i; $('file').click(); } else { sel=i; render(); } return; }
  if(sel !== i){ sel = i; render(); }
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  stage.setPointerCapture(e.pointerId);
  if(ptrs.size === 1){ const p=photos[i]; gesture = {i, sx:e.clientX, sy:e.clientY, ox:p.ox, oy:p.oy}; frameEl(i).classList.add('drag'); }
  else if(ptrs.size === 2 && gesture){
    const [a,b] = [...ptrs.values()];
    gesture.pinch = {d:Math.hypot(a.x-b.x,a.y-b.y), s:photos[gesture.i].s};
  }
});
stage.addEventListener('pointermove', e => {
  if(!gesture || !ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const p = photos[gesture.i]; if(!p) return;
  if(gesture.pinch && ptrs.size >= 2){
    const [a,b] = [...ptrs.values()];
    const d = Math.hypot(a.x-b.x,a.y-b.y);
    const mid = localPt(gesture.i, {clientX:(a.x+b.x)/2, clientY:(a.y+b.y)/2});
    zoomBy(gesture.i, (gesture.pinch.s*d/gesture.pinch.d)/p.s, mid.x, mid.y);
  } else if(!gesture.pinch){
    const k = unit();
    p.ox = gesture.ox + (e.clientX-gesture.sx)*k; p.oy = gesture.oy + (e.clientY-gesture.sy)*k;
    place(gesture.i);
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size === 0 && gesture){ frameEl(gesture.i)?.classList.remove('drag'); gesture=null; save(); }
  else if(gesture && ptrs.size === 1){ const [a]=[...ptrs.values()], p=photos[gesture.i]; Object.assign(gesture,{pinch:null,sx:a.x,sy:a.y,ox:p.ox,oy:p.oy}); }
}
stage.addEventListener('pointerup', endPtr); stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('wheel', e => {
  const f = e.target.closest('.frame'); if(!f) return; const i=+f.dataset.i; if(!photos[i]) return;
  e.preventDefault();
  const c = localPt(i, e);
  zoomBy(i, Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015)), c.x, c.y);
}, {passive:false});
stage.addEventListener('dblclick', e => {
  const f = e.target.closest('.frame'); if(!f) return; const i=+f.dataset.i;
  if(photos[i]){ reset(photos[i]); place(i); save(); }
});
document.addEventListener('pointerdown', e => { if(!e.target.isConnected) return; if(!e.target.closest('.stage') && !e.target.closest('.modal') && sel>=0 && !e.target.closest('.bar')){ sel=-1; render(); } });
document.addEventListener('keydown', e => {
  if(e.target.closest && e.target.closest('input')) return;
  if(e.key==='Escape' && (sel>=0 || selCover>=0)){ sel=-1; selCover=-1; render(); return; }

  if(selCover>=0 && (e.key==='Delete'||e.key==='Backspace')){ e.preventDefault(); S.covers.splice(selCover,1); selCover=-1; render(); save(); return; }
  if(sel<0 || !photos[sel]) return;
  const p = photos[sel], st = e.shiftKey ? 20 : 4;
  const moves = {ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]};
  if(moves[e.key]){ e.preventDefault(); p.ox+=moves[e.key][0]; p.oy+=moves[e.key][1]; place(sel); saveSoon(); }
  else if(e.key==='+'||e.key==='='){ zoomBy(sel,1.08); }
  else if(e.key==='-'){ zoomBy(sel,1/1.08); }
  else if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); photos[sel]=null; render(); save(); }
});

/* ---------- bringing photos in ---------- */
let pickTarget = -1;
$('file').onchange = e => { addFiles([...e.target.files], pickTarget); e.target.value=''; };
function loadImage(blob){
  return new Promise((res, rej) => { const url = URL.createObjectURL(blob), im = new Image();
    im.onload = () => res({url, blob, w:im.naturalWidth, h:im.naturalHeight, s:1, ox:0, oy:0, flip:false});
    im.onerror = () => { URL.revokeObjectURL(url); rej(); }; im.src = url; });
}
async function addFiles(files, target){
  files = files.filter(f => f.type.startsWith('image/'));
  if(!files.length) return;
  const n = lay().cells.length, slots = [];
  if(target >= 0) slots.push(target);
  for(let i=0;i<n && slots.length<files.length;i++) if(!photos[i] && !slots.includes(i)) slots.push(i);
  let bad = 0;
  for(let k=0;k<files.length && k<slots.length;k++){
    try{ photos[slots[k]] = await loadImage(files[k]); }catch{ bad++; }
  }
  if(files.length > slots.length) toast(`${files.length-slots.length} photo(s) left out: every window is full`);
  if(bad) toast('That file could not be opened as a picture');
  sel = slots[0] ?? sel; render(); save();
}
let overEl = null;
function setOver(el){ if(overEl===el) return; overEl?.classList.remove('over'); overEl=el; el?.classList.add('over'); }
window.addEventListener('dragover', e => { e.preventDefault(); setOver(e.target.closest?.('.frame') || null); });
window.addEventListener('dragleave', e => { if(!e.relatedTarget) setOver(null); });
window.addEventListener('drop', e => {
  e.preventDefault(); const f = e.target.closest?.('.frame'); setOver(null);
  addFiles([...e.dataTransfer.files], f ? +f.dataset.i : -1);
});
window.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.files||[])]; if(!files.length) return;
  e.preventDefault(); addFiles(files, sel >= 0 ? sel : -1);
});

/* ---------- export ---------- */
async function drawSheet(W, type='image/png'){
  const k = W/BW, c = document.createElement('canvas'); c.width=W; c.height=Math.round(W*BH/BW);
  const g = c.getContext('2d'); g.imageSmoothingQuality='high';
  g.fillStyle=S.sheet; g.fillRect(0,0,c.width,c.height);
  const R = rects(lay(), S.gap, pad());
  for(let i=0;i<R.length;i++){
    const r = R[i], p = photos[i];
    g.save(); g.beginPath();
    g.roundRect ? g.roundRect(r.x*k, r.y*k, r.w*k, r.h*k, S.rad*k) : g.rect(r.x*k, r.y*k, r.w*k, r.h*k);
    g.clip(); g.fillStyle=S.fill; g.fillRect(r.x*k, r.y*k, r.w*k, r.h*k);
    if(p){
      const im = new Image(); im.src = p.url; await im.decode();
      const b = imgBox(p, r);
      g.translate((r.x+b.x+b.w/2)*k, (r.y+b.y+b.h/2)*k);
      if(p.rot) g.rotate(p.rot*Math.PI/180);
      if(p.flip) g.scale(-1,1);
      g.drawImage(im, -b.w*k/2, -b.h*k/2, b.w*k, b.h*k);
      g.setTransform(1,0,0,1,0,0);
    }
    if(S.labels){
      g.font = `600 ${13*k}px "DM Sans", system-ui, sans-serif`;
      if('letterSpacing' in g) g.letterSpacing = (13*k*.04)+'px';
      g.fillStyle = p ? '#fff' : (lum(S.fill)<.5 ? '#fff' : '#111');
      if(p){ g.shadowColor='rgba(0,0,0,.5)'; g.shadowBlur=6*k; }
      g.textBaseline='alphabetic';
      g.fillText(r.label, (r.x+14)*k, (r.y+r.h-12)*k);
    }
    g.restore();
  }
  (S.covers||[]).forEach(cv => {
    const shape = () => { g.beginPath();
      if(cv.shape==='circle') g.ellipse(cv.x*k, cv.y*k, cv.w*k/2, cv.h*k/2, 0, 0, Math.PI*2);
      else if(g.roundRect) g.roundRect((cv.x-cv.w/2)*k, (cv.y-cv.h/2)*k, cv.w*k, cv.h*k, S.rad*k); else g.rect((cv.x-cv.w/2)*k, (cv.y-cv.h/2)*k, cv.w*k, cv.h*k); };
    if(cv.color === 'blur'){
      // blur what is under the cover: a copy of the sheet, blurred, drawn inside the shape
      const rad = blurOf(cv)*k, m = rad*3, x0 = Math.max(0,(cv.x-cv.w/2)*k-m), y0 = Math.max(0,(cv.y-cv.h/2)*k-m);
      const w0 = Math.min(c.width-x0, cv.w*k+2*m), h0 = Math.min(c.height-y0, cv.h*k+2*m);
      const t = document.createElement('canvas'); t.width = Math.ceil(w0); t.height = Math.ceil(h0); const tg = t.getContext('2d');
      if('filter' in tg){ tg.filter = `blur(${rad}px)`; tg.drawImage(c, x0, y0, w0, h0, 0, 0, w0, h0); }
      else { const sm = document.createElement('canvas'), f = Math.max(1, rad/2); sm.width = Math.max(1, Math.round(w0/f)); sm.height = Math.max(1, Math.round(h0/f));
        sm.getContext('2d').drawImage(c, x0, y0, w0, h0, 0, 0, sm.width, sm.height); tg.imageSmoothingQuality='high'; tg.drawImage(sm, 0, 0, w0, h0); }
      g.save(); shape(); g.clip(); g.drawImage(t, x0, y0); g.restore();
      return;
    }
    g.save(); g.fillStyle = cv.color; g.beginPath();
    if(cv.shape==='circle') g.ellipse(cv.x*k, cv.y*k, cv.w*k/2, cv.h*k/2, 0, 0, Math.PI*2);
    else if(g.roundRect) g.roundRect((cv.x-cv.w/2)*k, (cv.y-cv.h/2)*k, cv.w*k, cv.h*k, S.rad*k); else g.rect((cv.x-cv.w/2)*k, (cv.y-cv.h/2)*k, cv.w*k, cv.h*k);
    g.fill(); g.restore();
  });
  if(type==='image/jpeg'){ // JPEG has no transparency: put the sheet colour under everything once more
    const o = document.createElement('canvas'); o.width=c.width; o.height=c.height; const og=o.getContext('2d');
    og.fillStyle=S.sheet; og.fillRect(0,0,o.width,o.height); og.drawImage(c,0,0);
    return new Promise((res,rej) => o.toBlob(b => b ? res(b) : rej(), type, 0.95));
  }
  return new Promise((res,rej) => c.toBlob(b => b ? res(b) : rej(), type));
}
/* Export: a small window to pick PNG or JPEG and 4K, 6K or 8K (the long side 3840, 5760 or 7680) */
const SIZES = [['4K',3840],['6K',5760],['8K',7680]];
function exportPng(){
  const ex = Object.assign({fmt:'png', size:'4K'}, S.export||{});
  const dims = long => BW >= BH ? [long, Math.round(long*BH/BW)] : [Math.round(long*BW/BH), long];
  const m = document.createElement('div'); m.className='modal';
  const draw = () => {
    m.innerHTML = `<div class="card" style="max-width:460px"><h2>Export the sheet</h2>
      <p>Format</p><div class="row">${['png','jpg'].map(f=>`<button type="button" class="pill" data-f="${f}" aria-pressed="${ex.fmt===f}">${f==='png'?'PNG · lossless':'JPEG · smaller file'}</button>`).join('')}</div>
      <p>Size</p><div class="row">${SIZES.map(([n,l])=>{const [w,h]=dims(l);return `<button type="button" class="pill" data-s="${n}" aria-pressed="${ex.size===n}">${n} <span style="opacity:.6">${w} × ${h}</span></button>`}).join('')}</div>
      <div class="row"><span class="spacer" style="flex:1"></span><button type="button" class="pill" id="xNo">Cancel</button><button type="button" class="pill main" id="xGo"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Export</button></div></div>`;
  };
  draw();
  m.onclick = e => {
    const t = e.target.closest('button');
    if(e.target===m || t?.id==='xNo'){ m.remove(); return; }
    if(t?.dataset.f){ ex.fmt=t.dataset.f; draw(); }
    else if(t?.dataset.s){ ex.size=t.dataset.s; draw(); }
    else if(t?.id==='xGo'){ S.export = ex; save(); m.remove(); runExport(dims(SIZES.find(x=>x[0]===ex.size)[1])[0], ex.fmt); }
  };
  document.body.appendChild(m);
}
async function runExport(W, fmt){
  const btn = $('export'); btn.disabled = true; toast('Making the sheet…');
  try{
    const type = fmt==='jpg' ? 'image/jpeg' : 'image/png';
    const blob = await drawSheet(W, type);
    const name = `character-sheet-${new Date().toISOString().slice(0,10)}.${fmt}`;
    const file = new File([blob], name, {type});
    if(matchMedia('(pointer:coarse)').matches && navigator.canShare?.({files:[file]})){
      try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==='AbortError') return; }
    }
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('Saved to your Downloads');
  } catch(e){ toast('This size is too big for this browser. Try 6K or 4K.'); }
  finally { btn.disabled = false; }
}
function askClear(){
  const m = document.createElement('div'); m.className='modal';
  m.innerHTML = `<div class="card" style="max-width:420px"><h2>Empty every window?</h2><p>The photos leave this sheet. The layout and colours stay.</p><div class="row"><span class="spacer"></span><button class="pill" id="no">Keep them</button><button class="pill main" id="yes">Empty</button></div></div>`;
  m.onclick = e => { if(e.target.id==='yes'){ photos=[]; sel=-1; render(); save(); } if(e.target===m||e.target.id==='no'||e.target.id==='yes') m.remove(); };
  document.body.appendChild(m);
}
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(), 2600); }

/* ---------- keep the work in this browser ---------- */
let dbp = null;
function idb(){ if(!dbp) dbp = new Promise((res,rej)=>{ try{ const r=indexedDB.open('roarref',1); r.onupgradeneeded=()=>r.result.createObjectStore('s'); r.onsuccess=()=>res(r.result); r.onerror=rej; }catch(e){ rej(e); } }); return dbp; }
async function save(){
  try{ const d = await idb(); const tx = d.transaction('s','readwrite');
    tx.objectStore('s').put({S, photos: photos.map(p => p ? {blob:p.blob,w:p.w,h:p.h,s:p.s,ox:p.ox,oy:p.oy,flip:p.flip} : null)}, 'state');
  }catch{}
}
let st; function saveSoon(){ clearTimeout(st); st=setTimeout(save, 400); }
async function restore(){
  try{
    const d = await idb();
    const v = await new Promise((res,rej)=>{ const r=d.transaction('s').objectStore('s').get('state'); r.onsuccess=()=>res(r.result); r.onerror=rej; });
    if(v){ S = Object.assign(S, v.S); photos = (v.photos||[]).map(p => p ? Object.assign({}, p, {url:URL.createObjectURL(p.blob)}) : null); }
  }catch{}
  render();
}
buildPanel(); render(); restore();
</script>
<script src="../../../stats.js" defer></script>
