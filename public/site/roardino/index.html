<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Roardino · The call sheet in one link · by The Mad Lions</title>
<link rel="canonical" href="https://themadlions.com/roardino/">
<meta property="og:title" content="Roardino · by The Mad Lions">
<meta property="og:description" content="Το ordino του γυρίσματος σε ένα link για το συνεργείο.">
<meta property="og:url" content="https://themadlions.com/roardino/">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23d40000'/%3E%3Ctext x='32' y='44' font-family='Arial Black,Arial' font-size='34' font-weight='900' text-anchor='middle' fill='%23fff'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* RoarMe's Simba theme: graphite glass, a lit top, Ferrari red, the system font, Jost for the wordmark */
:root{
  --bg:#1b1e23; --panel:rgba(44,49,57,.62); --panel2:rgba(255,255,255,.045); --line:rgba(255,255,255,.1); --text:#eef0f3; --muted:rgba(214,220,228,.62);
  --brand:#d40000; --brand-ink:#fff; --field:rgba(0,0,0,.22); --radius:14px; --hi:#ffffff;
  --glass:rgba(255,255,255,.055); --glass-edge:rgba(255,255,255,.12);
  --lit:inset 0 1px 0 rgba(255,255,255,.08), 0 30px 70px rgba(0,0,0,.28);
  --ease:cubic-bezier(.16,1,.3,1);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{background:var(--bg)}
body:not(.viewer)::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(1200px 700px at 50% -12%,#4b525d 0%,transparent 62%),radial-gradient(700px 520px at 85% 90%,rgba(212,0,0,.12),transparent 70%),linear-gradient(180deg,#2b3038 0%,#1c1f24 55%,#15171b 100%)}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:8px}
/* the wordmark, as RoarMe's: ROAR thin, DINO heavy, by THEMADLIONS with MAD bold */
.rm{font-family:Jost,var(--font);display:inline-flex;align-items:baseline;letter-spacing:.02em;line-height:.9}
.rm .a{font-weight:200}.rm .b{font-weight:800}
.by{font-family:Jost,var(--font);font-size:10px;font-weight:400;letter-spacing:.2em;text-transform:lowercase;color:var(--muted)}
.by b{font-weight:300;text-transform:uppercase;letter-spacing:.14em;color:color-mix(in srgb,var(--text) 85%,transparent)}
.by b strong{font-weight:800}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.hidden{display:none!important}

/* ---------- App chrome ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px;
  padding-top:max(12px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-decoration:none}
.brand .rm{font-size:21px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--glass-edge);background:var(--glass);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);text-decoration:none;
  padding:10px 18px;border-radius:999px;font-weight:500;letter-spacing:.02em;font-size:14px;white-space:nowrap;transition:transform .25s var(--ease),background .2s,border-color .2s,filter .2s}
.btn:hover{background:color-mix(in srgb,var(--hi) 12%,transparent);border-color:color-mix(in srgb,var(--hi) 30%,transparent)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.primary{background:var(--brand);border-color:transparent;color:#fff;box-shadow:0 10px 30px color-mix(in srgb,var(--brand) 28%,transparent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--brand)}
.btn.ghost{background:transparent}
.btn.small{padding:7px 14px;font-size:13px}
.btn.icon{padding:9px;width:38px;height:38px}
.btn.danger{color:#ff5a4f}
.btn svg{width:18px;height:18px}

/* ---------- Home ---------- */
.home{max-width:980px;margin:0 auto;padding:28px 16px 80px}
.kicker{margin:10px 0 0;font-family:Jost,var(--font);font-size:13px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;color:var(--brand)}
.hero-h{font-family:Jost,var(--font);font-size:clamp(40px,7vw,76px);line-height:.95;letter-spacing:-.01em;font-weight:200;margin:14px 0 16px}
.hero-h b{font-weight:800}
.lede{color:color-mix(in srgb,var(--text) 75%,transparent);max-width:600px;margin:0 0 30px;font-size:17px;font-weight:300;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--lit);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.card-cover{height:120px;background:var(--panel2) center/cover no-repeat;position:relative}
.card-cover .chip{position:absolute;left:12px;bottom:10px}
.card-body{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-title{font-weight:600;font-size:16px}
.card-meta{color:var(--muted);font-size:13px}
.card-actions{display:flex;gap:6px;padding:0 14px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.55);color:#fff}
.new-card{border:1px dashed color-mix(in srgb,var(--text) 22%,transparent);background:transparent;box-shadow:none;min-height:230px;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-weight:700}
.new-card .plus{width:48px;height:48px;border-radius:50%;box-shadow:0 10px 30px rgba(212,0,0,.3);background:var(--brand);color:#fff;display:grid;place-items:center;font-size:26px}
.empty-note{color:var(--muted);font-size:13px;margin-top:22px}

/* ---------- Editor ---------- */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;max-width:1240px;margin:0 auto;padding:20px 16px 90px}
.form{display:flex;flex-direction:column;gap:12px;min-width:0}
.section{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--lit);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.section > summary{list-style:none;display:flex;align-items:center;gap:10px;padding:15px 16px;cursor:pointer;font-weight:600;font-size:16px}
.section > summary::-webkit-details-marker{display:none}
.section > summary .sub{color:var(--muted);font-weight:600;font-size:13px}
.section > summary .chev{margin-left:auto;transition:transform .2s;color:var(--muted)}
.section[open] > summary .chev{transform:rotate(180deg)}
.section .inner{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.section > summary .head-sw{margin-left:auto;display:flex}
.section > summary .head-sw + .chev{margin-left:0}
.section > summary .off-note{display:none}
.section.off > summary{color:var(--muted)}
.section.off > summary .off-note{display:inline}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.input,.select,.textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:15px;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand)}
.textarea{min-height:84px;resize:vertical;line-height:1.45}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:grid;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:8px}
.li .input{padding:8px 10px;font-size:14px}
.li-tools{display:flex;gap:4px}
.li-tools .btn{width:34px;height:34px;padding:0;border-radius:50%}
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--glass-edge);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:500;font-size:13px;letter-spacing:.03em;color:color-mix(in srgb,var(--text) 72%,transparent)}
.seg button.on{background:linear-gradient(180deg,color-mix(in srgb,var(--hi) 24%,transparent),color-mix(in srgb,var(--hi) 8%,transparent));box-shadow:inset 0 1px 0 color-mix(in srgb,var(--hi) 45%,transparent);color:var(--text)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;font-weight:600;font-size:14px}
.switch{appearance:none;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch:checked{background:var(--brand)}
.switch:checked::after{transform:translateX(18px)}
.toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;outline:1px solid var(--line)}
.sw.on{border-color:var(--text)}
.color-in{width:38px;height:32px;border:1px solid var(--line);border-radius:9px;background:none;padding:2px}
.img-pick{display:flex;gap:12px;align-items:center}
.img-thumb{width:88px;height:62px;border-radius:10px;background:var(--panel2) center/cover no-repeat;border:1px solid var(--line);flex:none}
.img-thumb.logo{width:62px;background-size:contain}
.hint{font-size:12px;color:var(--muted);line-height:1.45}
.blocks-order .li{grid-template-columns:auto 1fr auto}
.drag-h{color:var(--muted);font-weight:800;padding:0 4px}
.range{width:100%;accent-color:var(--brand)}

.preview-wrap{position:sticky;top:78px;align-self:start}
.phone{width:100%;max-width:400px;margin:0 auto;height:min(820px,calc(100vh - 110px));border-radius:42px;border:10px solid #050506;
  background:#000;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35),0 0 0 1px #2a2a30;position:relative}
.phone-scroll{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.phone-scroll::-webkit-scrollbar{display:none}
.preview-label{display:flex;justify-content:center;gap:8px;margin-bottom:10px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.mobile-tabs{display:none}

@media (max-width: 920px){
  .editor{grid-template-columns:1fr;padding-bottom:110px}
  .preview-wrap{position:static}
  .editor[data-view="edit"] .preview-wrap{display:none}
  .editor[data-view="preview"] .form{display:none}
  .phone{height:auto;border:0;border-radius:22px;box-shadow:none;max-width:460px}
  .phone-scroll{height:auto;overflow:visible}
  .mobile-tabs{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));z-index:30;
    background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .mobile-tabs button{border:0;background:transparent;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
  .mobile-tabs button.on{background:var(--brand);color:#fff}
  .hide-sm{display:none}
}

/* ---------- inside RoarMe ---------- */
body.embedded .topbar{padding-top:10px}
body.embedded .home{padding-top:14px}
body.embedded .home .hero-h, body.embedded .home .lede, body.embedded .empty-note{display:none}
body.embedded::before{display:none}

/* ---------- Sign in ---------- */
/* the front page for someone not signed in (Alex, 18 Oct): what it is and the way in on the left, a live ordino on a
   phone on the right, then what it does, numbered */
.auth{max-width:1180px;margin:0 auto;padding:clamp(28px,6vw,72px) 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:clamp(28px,6vw,90px);align-items:center}
.auth .hero-h{font-size:clamp(44px,5.4vw,76px);margin:16px 0 18px}
.auth-in{display:flex;flex-direction:column;gap:0;max-width:600px}
.auth-in .auth-card{margin-top:6px}
.auth-phone{position:relative;justify-self:center;width:min(360px,100%)}
.auth-phone::before{content:'';position:absolute;left:8%;right:8%;top:14%;bottom:-4%;background:radial-gradient(closest-side,rgba(212,0,0,.32),transparent);filter:blur(50px);z-index:-1}
.auth-phone .hand{aspect-ratio:9/18.5;border-radius:44px;border:10px solid #050506;background:#1b1e23;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
.auth-phone iframe{display:block;width:100%;height:100%;border:0}
.auth-phone .cap{position:absolute;left:-18px;bottom:5%;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:999px;background:rgba(27,30,35,.9);border:1px solid var(--glass-edge);font-size:12px;box-shadow:0 14px 34px rgba(0,0,0,.4)}
.auth-phone .cap i{width:24px;height:24px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:#fff}
.auth-phone .cap i svg{width:14px;height:14px}
.feats{max-width:1180px;margin:0 auto;padding:30px 16px 40px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.feat{padding:26px 22px 26px 0;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line);margin-right:22px}
.feat:last-child{border-right:0;margin-right:0}
.feat .no{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px;letter-spacing:.14em;color:var(--brand)}
.feat b{font-size:17px;font-weight:650}
.feat p{margin:0;font-size:14.5px;line-height:1.55;color:var(--muted)}
.how{max-width:1180px;margin:0 auto;padding:clamp(30px,5vw,56px) 16px 10px}
.how-h{font-family:Jost,var(--font);font-size:clamp(30px,4.4vw,52px);font-weight:200;line-height:1;letter-spacing:-.01em;margin:10px 0 clamp(20px,3vw,32px)}
.how-h b{font-weight:800}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.step{padding:22px;border-radius:22px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--lit);display:flex;flex-direction:column;gap:8px}
.step .no{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px;letter-spacing:.14em;color:var(--brand)}
.step b{font-size:18px;font-weight:650}
.step p{margin:0;font-size:14.5px;line-height:1.55;color:var(--muted)}
.inside{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(24px,5vw,72px);border-top:1px solid var(--line)}
.in-row{display:grid;grid-template-columns:34px minmax(0,1fr);grid-template-rows:auto 1fr;align-items:start;gap:3px 12px;padding:18px 0;border-bottom:1px solid var(--line)}
.in-row .no{grid-row:span 2;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px;color:var(--muted);padding-top:3px}
.in-row b{font-size:16px;font-weight:650}
.in-row p{margin:0;font-size:14.5px;line-height:1.55;color:var(--muted)}
.how + .how{padding-top:clamp(36px,5vw,60px)}
.how:last-of-type{padding-bottom:clamp(36px,5vw,60px)}
.roar-strip{max-width:1180px;margin:0 auto 60px;padding:0 16px}
.roar-strip>div{display:flex;align-items:center;gap:clamp(16px,3vw,36px);padding:clamp(20px,3vw,30px);border-radius:24px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--lit)}
.roar-strip .ic{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,90,80,.6);box-shadow:0 0 0 5px rgba(212,0,0,.16)}
.roar-strip .ic svg{width:26px;height:26px}
.roar-strip .tx{flex:1;min-width:0}
.roar-strip .tx b{display:block;font-size:18px;font-weight:650;margin-bottom:4px}
.roar-strip .tx span{font-size:14.5px;color:var(--muted);line-height:1.55}
.auth-foot{max-width:1180px;margin:0 auto;padding:22px 16px calc(28px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.auth-foot a{text-decoration:none;color:var(--muted)} .auth-foot a:hover{color:var(--text)}
@media (max-width:920px){
  .auth{grid-template-columns:minmax(0,1fr)}
  .auth-phone{width:min(300px,82%)}
  .auth-phone .cap{left:-8px}
  .feats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:minmax(0,1fr)}
  .feat:nth-child(2){border-right:0;margin-right:0}
  .feat:nth-child(-n+2){border-bottom:1px solid var(--line)}
}
@media (max-width:560px){
  .feats{grid-template-columns:minmax(0,1fr)}
  .inside{grid-template-columns:minmax(0,1fr)}
  .feat{border-right:0;margin-right:0;border-bottom:1px solid var(--line);padding:20px 0}
  .feat:last-child{border-bottom:0}
  .roar-strip>div{flex-direction:column;align-items:flex-start}
}
.auth-card{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--lit);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{font-size:14px;line-height:1.5;color:var(--muted);margin:0}
.msg.err{color:#ff7a70}
.msg.ok{color:#7ee2a0}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:0;font-size:13px;cursor:pointer;align-self:flex-start}
.me{display:inline-flex;align-items:center;gap:8px}
.me .o-av{object-fit:cover;width:26px;height:26px;font-size:11px;background:color-mix(in srgb,var(--brand) 30%,transparent);color:#fff;border-radius:50%;display:grid;place-items:center;font-weight:700}
.save-state{font-size:12px;color:var(--muted);font-weight:500}
.topbar .tb > span:first-child{display:flex}
.topbar .tb svg{width:17px;height:17px}
/* the editor's bar on a phone: Duplicate and Send as round icons, so nothing runs off the screen */
@media (max-width:560px){
  .topbar{gap:8px}
  .topbar .tb{width:40px;height:40px;padding:0;border-radius:50%;flex:none}
  .topbar .tb .lbl{display:none}
  .topbar .save-state{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
.center-note{min-height:50vh;display:grid;place-items:center;color:var(--muted)}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:grid;place-items:end center;padding:16px;backdrop-filter:blur(4px)}
@media (min-width:640px){.modal-bg{place-items:center}}
.modal{width:100%;max-width:480px;background:rgba(36,40,47,.92);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:var(--lit);border:1px solid var(--glass-edge);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0;font-size:20px;letter-spacing:-.02em}
.modal p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.linkbox{display:flex;gap:8px}
.linkbox .input{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* =====================================================
   ORDINO — the mobile link page
   ===================================================== */
.ord{--acc:#d40000;--o-bg:#1b1e23;--o-card:rgba(255,255,255,.055);--o-line:rgba(255,255,255,.09);--o-text:#f5f3ef;--o-muted:rgba(245,243,239,.6);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',sans-serif;background:var(--o-bg);color:var(--o-text);min-height:100%;font-size:16px;position:relative;isolation:isolate;overflow:hidden}
.ord.s-small{font-size:14.5px}
.ord.t-light{--o-bg:#f6f4f0;--o-card:#ffffff;--o-line:rgba(0,0,0,.08);--o-text:#16150f;--o-muted:rgba(22,21,15,.58)}
.ord.t-glass{--o-bg:#1b1e23;--o-card:rgba(255,255,255,.08);--o-line:rgba(255,255,255,.14)}
.ord .bgblur{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center;filter:blur(40px) saturate(1.3);opacity:.55;transform:scale(1.2)}
.ord.t-glass .bgblur{opacity:.75}
.ord:not(.t-glass) .bgblur{display:none}
.ord .glassveil{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(27,30,35,.35),rgba(27,30,35,.82) 60%,#1b1e23)}
.ord:not(.t-glass) .glassveil{display:none}

.o-hero{position:relative;min-height:22em;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;padding:1.4em 1.25em 1.6em}
.o-hero.nocover{min-height:auto;padding-top:3.2em}
.o-cover{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;z-index:0}
.o-shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 30%,var(--o-bg) 100%)}
.ord.t-light .o-shade{background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,0) 35%,var(--o-bg) 100%)}
.o-shade-dim{position:absolute;inset:0;z-index:1;background:#000}
.o-hero > *:not(.o-cover):not(.o-shade):not(.o-shade-dim){position:relative;z-index:2}
.o-logo{position:absolute!important;top:1.2em;left:50%;transform:translateX(-50%);max-height:2.6em;max-width:9em;object-fit:contain}
.o-head{display:flex;flex-direction:column;gap:.4em}
.o-head.centred{align-items:center;text-align:center}
.o-label{display:inline-block;font-size:.72em;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#fff;background:var(--acc);padding:.42em .85em;border-radius:99px}
.o-title{font-size:2.05em;line-height:1.02;font-weight:800;letter-spacing:-.035em;margin:.15em 0 0}
.o-artist{font-size:1.02em;font-weight:600;color:var(--o-muted)}
.o-hero .o-artist{color:rgba(255,255,255,.78)}
.ord.t-light .o-hero.nocover .o-artist{color:var(--o-muted)}
.o-hero:not(.nocover) .o-title{color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.ord.t-light .o-hero:not(.nocover) .o-title{color:var(--o-text);text-shadow:none}
.ord.t-light .o-hero:not(.nocover) .o-artist{color:var(--o-muted)}
.o-date{margin-top:.55em;display:inline-flex;gap:.5em;align-items:center;font-size:.86em;font-weight:700;padding:.5em .9em;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff}
.ord.t-light .o-date{background:rgba(255,255,255,.75);border-color:var(--o-line);color:var(--o-text)}
.ord.t-light .o-hero.nocover .o-date{background:var(--o-card)}
.o-hero.nocover .o-date{color:var(--o-text);background:var(--o-card);border-color:var(--o-line)}

.o-body{padding:0 1em 2.5em;display:flex;flex-direction:column;gap:.85em;max-width:34em;margin:0 auto}
.o-card{background:var(--o-card);border:1px solid var(--o-line);border-radius:1.35em;padding:1.1em 1.15em}
.ord.t-glass .o-card{backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.ord.t-light .o-card{box-shadow:0 1px 2px rgba(0,0,0,.04)}
.o-h{display:flex;align-items:center;gap:.55em;font-size:.72em;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--o-muted);margin:0 0 .85em}
.o-h::before{content:"";width:.5em;height:.5em;border-radius:50%;background:var(--acc)}

.o-call{display:flex;align-items:flex-end;justify-content:space-between;gap:1em;flex-wrap:wrap}
.o-call-time{font-size:3.6em;font-weight:800;letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums}
.o-call-k{font-size:.72em;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:.45em}
.o-call-side{display:flex;flex-direction:column;align-items:flex-end;gap:.35em;font-size:.88em;color:var(--o-muted);font-weight:600}
.o-call-side b{color:var(--o-text);font-variant-numeric:tabular-nums}
.o-chips{display:flex;flex-wrap:wrap;gap:.45em;margin-top:1em}
.o-chip{display:inline-flex;align-items:center;gap:.4em;font-size:.82em;font-weight:700;padding:.45em .75em;border-radius:99px;background:color-mix(in srgb,var(--o-text) 7%,transparent);border:1px solid var(--o-line)}
.o-chip svg{width:1.05em;height:1.05em}

.o-tag{font-family:'Nunito',system-ui,sans-serif;text-align:center;font-size:1em;line-height:1.5;padding:1em 1.2em;border-radius:1.2em;border:1px dashed color-mix(in srgb,var(--acc) 55%,transparent);background:color-mix(in srgb,var(--acc) 10%,transparent)}

.o-rows{display:flex;flex-direction:column}
.o-r{display:grid;grid-template-columns:4.6em 1fr;gap:.9em;align-items:baseline;padding:.7em 0;border-top:1px solid var(--o-line)}
.o-r:first-child{border-top:0;padding-top:0}
.o-r:last-child{padding-bottom:0}
.o-r .t{font-weight:800;font-variant-numeric:tabular-nums;color:var(--acc)}
.o-r .w{font-weight:600;line-height:1.35}
.o-r .w small{display:block;color:var(--o-muted);font-weight:600;font-size:.82em;margin-top:.15em}

.o-tl{position:relative;display:flex;flex-direction:column;gap:0;padding-left:1.1em}
.o-tl::before{content:"";position:absolute;left:.28em;top:.5em;bottom:.5em;width:2px;background:var(--o-line);border-radius:2px}
.o-tl-i{position:relative;padding:.55em 0}
.o-tl-i::before{content:"";position:absolute;left:-1.06em;top:1.02em;width:.62em;height:.62em;border-radius:50%;background:var(--o-bg);border:2px solid var(--acc)}
.o-tl-i.brk::before{background:var(--acc)}
.o-tl-time{font-size:.8em;font-weight:800;color:var(--o-muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.o-tl-what{font-weight:700;line-height:1.3;margin-top:.1em}

.o-loc-name{font-size:1.25em;font-weight:800;letter-spacing:-.02em}
.o-loc-addr{color:var(--o-muted);font-weight:600;margin-top:.25em;line-height:1.4}
.o-btns{display:flex;flex-wrap:wrap;gap:.5em;margin-top:1em}
.o-btn{display:inline-flex;align-items:center;gap:.45em;text-decoration:none;font-weight:800;font-size:.88em;padding:.7em 1em;border-radius:99px;background:color-mix(in srgb,var(--o-text) 8%,transparent);border:1px solid var(--o-line);color:var(--o-text)}
.o-btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.o-btn svg{width:1.1em;height:1.1em}
.o-btns-2{flex-wrap:nowrap}
.o-btns-2 .o-btn{flex:1 1 0;justify-content:center;padding:.85em 1em;border-radius:.8em}
.o-loc-who{color:var(--o-muted);margin-top:.2em;font-weight:600}
.o-loc-who a{color:inherit;text-decoration:none}
.o-xloc{margin-top:1em;padding-top:.85em;border-top:1px solid var(--o-line)}
.o-xloc-h{font-size:.72em;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--o-muted);margin-bottom:.45em}
.o-xloc-r{display:flex;align-items:baseline;gap:.8em;padding:.25em 0;font-weight:600;font-size:.92em}
.o-xloc-r span{flex:1;min-width:0}
.o-xloc-r b{font-weight:700}
.o-xloc-r a{flex:none;color:var(--acc);font-weight:800;text-decoration:none}
.o-kv{display:flex;flex-direction:column;gap:.15em;margin-top:.9em;padding-top:.85em;border-top:1px solid var(--o-line)}
.o-kv .k{font-size:.72em;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--o-muted)}
.o-kv .v{font-weight:600;line-height:1.4;white-space:pre-wrap}

.o-people{display:flex;flex-direction:column}
.o-p{display:flex;align-items:center;gap:.8em;padding:.65em 0;border-top:1px solid var(--o-line);text-decoration:none}
.o-p:first-child{border-top:0;padding-top:0}
.o-p:last-child{padding-bottom:0}
.o-av{width:2.4em;height:2.4em;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:.85em;background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc)}
.o-p .n{font-weight:700;line-height:1.25}
.o-p .r{font-size:.84em;color:var(--o-muted);font-weight:600}
.o-p .e{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;color:var(--acc);font-size:.92em;display:flex;align-items:center;gap:.4em}
.o-p .e svg{width:1.1em;height:1.1em}

.o-note{white-space:pre-wrap;line-height:1.55;font-weight:500}
.o-note a{color:var(--acc);font-weight:700;text-decoration:none}
.o-foot{display:flex;flex-direction:column;align-items:center;gap:1em;padding:1em 0 .5em}
.o-foot .o-btns{justify-content:center;margin-top:0}
.o-made{font-size:.72em;color:var(--o-muted);font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
.o-made b{color:var(--o-text)}

/* standalone viewer */
body.viewer{background:#1b1e23}
body.viewer.v-light{background:#f6f4f0}
.viewer-root{max-width:560px;margin:0 auto;min-height:100vh}
.viewer-root .ord{min-height:100vh}
@media (min-width:600px){ .viewer-root .o-hero{border-radius:0 0 2em 2em} }
.v-error{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
@media print{ .o-foot .o-btns{display:none} }

/* ---------- Admin panel ---------- */
.adm-title{font-family:Jost,var(--font);font-size:20px;font-weight:800;letter-spacing:.01em}
.adm-tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:980px){.adm-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.adm-tile{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--lit)}
.adm-tile b{font-family:Jost,var(--font);font-size:34px;font-weight:800;line-height:1}
.adm-tile span,.adm-stat span{font-size:12px;color:var(--muted)}
.adm-h{margin:30px 0 12px;font-family:Jost,var(--font);font-size:13px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.adm-bars{display:flex;align-items:flex-end;gap:6px;height:150px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px 16px 10px}
.adm-bar{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.adm-bar i{width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:var(--brand);position:relative;display:block}
.adm-bar em{position:absolute;top:-17px;left:0;right:0;text-align:center;font-style:normal;font-size:11px;font-weight:700}
.adm-bar span{font-size:11px;color:var(--muted)}
.adm-list{display:flex;flex-direction:column;gap:10px}
.adm-row{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center}
.adm-who{display:flex;align-items:center;gap:12px;min-width:0}
.adm-who>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.adm-who b{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.adm-who span:not(.o-av):not(.chip){font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.adm-chip{background:var(--panel2);color:var(--muted);font-size:10px}
.adm-stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.adm-stat{min-width:70px;padding:8px 12px;border-radius:16px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;gap:1px}
.adm-stat b{font-size:18px;font-weight:800}
.adm-when{grid-column:1/-1;font-size:12px;color:var(--muted)}
@media (max-width:640px){
  .adm-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .adm-row{grid-template-columns:1fr}
  .adm-stats{justify-content:flex-start}
  .adm-stat{min-width:0;flex:1}

}

/* ---------- model ---------- */
function blankOrdino(){
  const today = new Date(); const d = today.toISOString().slice(0, 10);
  return {
    v: 1, id: uid(), createdAt: Date.now(), updatedAt: Date.now(),
    look: { theme: 'glass', accent: '#d40000', size: 'normal', header: 'centred' },
    project: { title: '', artist: '', company: '', logo: '', cover: '', coverPos: { x: 50, y: 40, z: 1, o: 0.25 } },
    day: { date: d, index: 1, count: 1, callTime: '08:00', wrapTime: '', label: 'GENERAL ORDINO', unit: '' },
    details: { cover: true, weather: true, sun: true },
    blocks: Object.keys(BLOCK_DEFS).map(key => ({ key, on: ['groupcalls','location','program','note'].includes(key), title: '' })),
    groupCalls: [ { who: 'Production crew', time: '07:00' }, { who: 'Cast / Make-up', time: '07:30' } ],
    loc: { name: '', address: '', link: '', contact: '', phone: '', parking: '', hospital: '', lat: '', lon: '' },
    lunch: '',
    program: [ { from: '08:00', to: '09:00', what: 'Προετοιμασία' }, { from: '09:00', to: '13:00', what: 'Γύρισμα' } ],
    scenes: [], cast: [], crew: [], contacts: [], extraLocs: [],
    notes: '', tagline: '',
  };
}
function normalize(o){
  const b = blankOrdino();
  const out = Object.assign(b, o || {});
  for (const k of ['look','project','day','details','loc']) out[k] = Object.assign(clone(blankOrdino()[k]), (o || {})[k] || {});
  out.project.coverPos = Object.assign({ x: 50, y: 40, z: 1, o: 0.25 }, out.project.coverPos || {});
  const known = new Set((out.blocks || []).map(x => x.key));
  out.blocks = (out.blocks || []).filter(x => BLOCK_DEFS[x.key]);
  for (const key of Object.keys(BLOCK_DEFS)) if (!known.has(key)) out.blocks.push({ key, on: false, title: '' });
  for (const k of ['groupCalls','program','scenes','cast','crew','contacts','extraLocs']) if (!Array.isArray(out[k])) out[k] = [];
  // before 23 Oct these had a switch: a value typed but switched off stays hidden, so it is cleared, then the switch goes
  const was = (o || {}).details || {};
  for (const [k, clear] of Object.entries(OLD_DETAILS)){ if (was[k] === false) clear(out); delete out.details[k]; }
  return out;
}

const COLS = 'id,data,token,published_at,updated_at';
const rowToOrdino = r => { const o = normalize(r.data); o.id = r.id; o.token = r.token; o.publishedAt = r.published_at; o.updatedAt = Date.parse(r.updated_at); return o; };
const toData = o => { const d = clone(o); for (const k of ['id','token','publishedAt','updatedAt','pub']) delete d[k]; return d; };
async function listOrdinos(){ const { data, error } = await sb.from('roardino_ordinos').select(COLS).order('updated_at', { ascending: false }); if (error) throw error; return data.map(rowToOrdino); }
async function getOrdino(id){ const { data, error } = await sb.from('roardino_ordinos').select(COLS).eq('id', id).maybeSingle(); if (error) throw error; return data && rowToOrdino(data); }
async function createOrdino(o){ const { data, error } = await sb.from('roardino_ordinos').insert({ data: toData(o) }).select(COLS).single(); if (error) throw error; return rowToOrdino(data); }
async function saveOrdino(o){ const { error } = await sb.from('roardino_ordinos').update({ data: toData(o), updated_at: new Date().toISOString() }).eq('id', o.id); if (error) throw error; }

async function deleteOrdino(id){ const { error } = await sb.from('roardino_ordinos').delete().eq('id', id); if (error) throw error; }
function localDrafts(){ try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch { return []; } }
async function importLocalDrafts(){
  const list = localDrafts(); if (!list.length) return 0;
  let n = 0;
  for (const d of list){ try { await createOrdino(normalize(d)); n++; } catch {} }

}
async function loadProfile(){
  const u = session.user;
  try { isAdmin = !!(await rpc('roar_is_admin')); } catch { isAdmin = false; }
  try { const r = await sb.from('roar_profiles').select('username,display_name,avatar_url').eq('id', u.id).maybeSingle(); roarMe = r.data || null; } catch { roarMe = null; }

  await sb.from('roardino_profiles').insert({ id: u.id, ...profile });
}

/* ---------- images ---------- */
function readImage(file, maxW, quality = 0.78, type = 'image/jpeg'){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => res(downscale(img, maxW, quality, type));
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function downscale(img, maxW, quality, type){
  const s = Math.min(1, maxW / img.naturalWidth);
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  const ctx = c.getContext('2d');
  if (type === 'image/jpeg'){ ctx.fillStyle = '#000'; ctx.fillRect(0, 0, c.width, c.height); }
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL(type, quality);
}
function shrinkDataUrl(src, maxW, quality, type){
  return new Promise(res => {
    if (!src) return res('');
    const img = new Image();
    img.onload = () => res(downscale(img, maxW, quality, type));
    img.onerror = () => res('');
    img.src = src;
  });
}

/* ---------- share link (compressed into the URL fragment) ---------- */
const b64u = {
  enc(bytes){ let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); },
  dec(str){ const s = atob(str.replace(/-/g,'+').replace(/_/g,'/')); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; },
};
async function pack(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream){
    const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return 'z' + b64u.enc(new Uint8Array(await new Response(cs).arrayBuffer()));
  }
  return 'j' + b64u.enc(bytes);
}
async function unpack(str){
  const kind = str[0], bytes = b64u.dec(str.slice(1));
  if (kind === 'z'){
    const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return JSON.parse(await new Response(ds).text());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
// Saves, then publishes the working copy behind the ordino's short link (the same link on every republish).
async function publishOrdino(o){
  await saveOrdino(o);
  const token = await rpc('roardino_publish', { p_id: o.id });
  o.token = token; o.publishedAt = new Date().toISOString();
  return linkFor(token);
}
const linkFor = token => location.origin + location.pathname + '?t=' + token;
// Inside RoarMe: publish, then hand RoarMe what it needs to post the ordino as a card in the open chat.
async function sendToChat(o){
  try {
    const url = await publishOrdino(o);
    window.parent.postMessage({ type: 'roardino:send', ordino: { v: 1, url, token: o.token, title: o.project.title || '', artist: o.project.artist || '',
      label: o.day.label || 'Ordino', date: o.day.date || '', call: o.day.callTime || '', place: o.loc.name || '', accent: o.look.accent || '#d40000' } }, parentOrigin);
    toast('Στάλθηκε στη συνομιλία');
  } catch { toast('Δεν στάλθηκε. Δοκίμασε ξανά.'); }
}

// Offline fallback: the whole ordino packed into the URL fragment.
async function buildShareUrl(o){
  const s = clone(o);
  delete s.id; delete s.createdAt; delete s.pub; delete s.token; delete s.publishedAt; delete s.updatedAt;
  // Smaller images so the link stays light enough for WhatsApp / Viber / SMS.
  s.project.cover = (s.details.cover && s.project.cover) ? await shrinkDataUrl(s.project.cover, 640, 0.55, 'image/jpeg') : '';
  s.project.logo = s.project.logo ? await shrinkDataUrl(s.project.logo, 220, 0.9, 'image/png') : '';
  s.blocks = s.blocks.filter(b => b.on);
  return location.origin + location.pathname + '#o=' + await pack(s);
}

/* ---------- weather (Open-Meteo, no key) ---------- */
const wxCache = new Map();
const WX = {0:'Αίθριος',1:'Κυρίως αίθριος',2:'Λίγα σύννεφα',3:'Συννεφιά',45:'Ομίχλη',48:'Ομίχλη',51:'Ψιχάλες',53:'Ψιχάλες',55:'Ψιχάλες',61:'Βροχή',63:'Βροχή',65:'Δυνατή βροχή',66:'Παγωμένη βροχή',67:'Παγωμένη βροχή',71:'Χιόνι',73:'Χιόνι',75:'Πυκνό χιόνι',77:'Χιόνι',80:'Μπόρες',81:'Μπόρες',82:'Δυνατές μπόρες',85:'Χιονόπτωση',86:'Χιονόπτωση',95:'Καταιγίδα',96:'Καταιγίδα',99:'Καταιγίδα'};
async function getWeather(lat, lon, date){
  if (!lat || !lon || !date) return null;
  const key = `${lat},${lon},${date}`;
  if (wxCache.has(key)) return wxCache.get(key);
  const p = (async () => {
    try {
      const u = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto&start_date=${date}&end_date=${date}`;
      const r = await fetch(u); if (!r.ok) throw 0;
      const j = await r.json(); const d = j.daily; if (!d || !d.time || !d.time.length) throw 0;
      return { code: d.weather_code[0], max: Math.round(d.temperature_2m_max[0]), min: Math.round(d.temperature_2m_min[0]), rain: d.precipitation_probability_max[0], sunrise: (d.sunrise[0] || '').slice(11, 16), sunset: (d.sunset[0] || '').slice(11, 16) };
    } catch {
      // Forecast only reaches ~16 days ahead; fall back to sunrise/sunset from the calculator.
      return { sunOnly: true, ...sunTimes(+lat, +lon, date) };
    }
  })();
  wxCache.set(key, p);
  return p;
}
// NOAA-style sunrise/sunset approximation (local time of the browser's zone offset for that date).
function sunTimes(lat, lon, dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  const rad = Math.PI / 180, day = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
  const g = 2 * Math.PI / 365 * (day - 1);
  const eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const ha = Math.acos(Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(decl)) - Math.tan(lat * rad) * Math.tan(decl)) / rad;
  if (isNaN(ha)) return {};
  const tz = -d.getTimezoneOffset();
  const fmt = m => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(Math.round(m % 60)).padStart(2, '0').replace('60', '59'); };
  return { sunrise: fmt(720 - 4 * (lon + ha) - eq + tz), sunset: fmt(720 - 4 * (lon - ha) - eq + tz) };
}
async function geocode(q){
  const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=el&q=' + encodeURIComponent(q));
  const j = await r.json();
  return j && j[0] ? { lat: (+j[0].lat).toFixed(5), lon: (+j[0].lon).toFixed(5), label: j[0].display_name } : null;
}

/* ---------- ordino renderer (shared by preview + link) ---------- */
function fmtDate(iso){
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  const s = d.toLocaleDateString('el-GR', { weekday: 'long', day: 'numeric', month: 'long' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function initials(n){ return String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?'; }
function telHref(p){ return 'tel:' + String(p).replace(/[^\d+]/g, ''); }
function linkify(text){
  return esc(text)
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/(\+?\d[\d\s]{8,}\d)/g, m => `<a href="${telHref(m)}">${m}</a>`);
}
// a Google Maps link pasted in (Alex, 19 Oct): the map button opens exactly that place
const MAPS_LINK = /^https:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps|maps\.google\.[a-z.]+|(www\.)?google\.[a-z.]+\/maps)\//i;
function mapsLink(loc){ const u = String(loc.link || '').trim(); return MAPS_LINK.test(u) ? u : ''; }
// the coordinates inside a long Google Maps link, for the weather and the sunset (a short maps.app.goo.gl link has none)
function coordsOf(u){
  const m = String(u || '').match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || String(u || '').match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || String(u || '').match(/[?&](?:q|query|ll|center)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/);
  return m ? { lat: (+m[1]).toFixed(5), lon: (+m[2]).toFixed(5) } : null;
}
// Directions and Open in Maps come only from the pasted Google Maps link (Alex, 19 Oct): never from the address or the looked-up spot
function mapsUrl(loc){ return mapsLink(loc); }
function dirUrl(loc){
  const u = mapsLink(loc), c = coordsOf(u);
  return c ? `https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lon}` : u;
}
function isBreak(what){ return /break|διάλειμμα|φαγητ|lunch|γεύμα/i.test(what || ''); }

function renderOrdino(o, { wx = null, interactive = true, updatedAt = null } = {}){
  const L = o.look, P = o.project, D = o.day, det = o.details;
  const cover = det.cover && P.cover;
  const cp = P.coverPos;
  const blockTitle = b => esc(b.title || BLOCK_DEFS[b.key]);
  const sec = (b, inner) => `<section class="o-card"><h3 class="o-h">${blockTitle(b)}</h3>${inner}</section>`;

  const chips = [];
  if (wx && !wx.sunOnly && det.weather) chips.push(`<span class="o-chip">${ICON.sun}${esc(WX[wx.code] || '')} · ${wx.max}° / ${wx.min}°</span>`, wx.rain != null ? `<span class="o-chip">${ICON.drop}${wx.rain}%</span>` : '');
  if (wx && det.sun && wx.sunrise) chips.push(`<span class="o-chip">${ICON.sun}${esc(wx.sunrise)}</span><span class="o-chip">${ICON.set}${esc(wx.sunset)}</span>`);

  const blocks = o.blocks.filter(b => b.on).map(b => {
    switch (b.key){
      case 'groupcalls': {
        const rows = o.groupCalls.filter(r => r.who || r.time);
        if (!rows.length) return '';
        return sec(b, `<div class="o-rows">${rows.map(r => `<div class="o-r"><span class="t">${esc(r.time)}</span><span class="w">${esc(r.who)}</span></div>`).join('')}</div>`);
      }
      case 'location': {
        const l = o.loc;
        // more places of the day (Alex, 19 Oct): name · address, and Directions to each
        const extra = (o.extraLocs || []).filter(x => x.name || x.address || mapsLink(x));
        if (!l.name && !l.address && !mapsLink(l) && !extra.length) return '';
        const m = mapsUrl(l), d = dirUrl(l);
        return sec(b, `
          ${l.name ? `<div class="o-loc-name">${esc(l.name)}</div>` : ''}
          ${l.address ? `<div class="o-loc-addr">${esc(l.address)}</div>` : ''}
          ${l.contact || l.phone ? `<div class="o-loc-who">${esc(l.contact || '')}${l.contact && l.phone ? ' · ' : ''}${l.phone ? `<a href="${telHref(l.phone)}">${esc(l.phone)}</a>` : ''}</div>` : ''}
          ${d || m ? `<div class="o-btns o-btns-2">
            ${d ? `<a class="o-btn acc" href="${esc(d)}" target="_blank" rel="noopener">Directions</a>` : ''}
            ${m ? `<a class="o-btn" href="${esc(m)}" target="_blank" rel="noopener">Open in Maps</a>` : ''}
          </div>` : ''}

          ${l.parking ? `<div class="o-kv"><span class="k">Parking</span><span class="v">${esc(l.parking)}</span></div>` : ''}
          ${l.hospital ? `<div class="o-kv"><span class="k">Πλησιέστερο νοσοκομείο</span><span class="v">${linkify(l.hospital)}</span></div>` : ''}
          ${extra.length ? `<div class="o-xloc"><div class="o-xloc-h">Extra Locations</div>${extra.map(x => {
            const xd = dirUrl(x);
            return `<div class="o-xloc-r"><span>${x.name ? `<b>${esc(x.name)}</b>` : ''}${x.name && x.address ? ' · ' : ''}${esc(x.address || '')}</span>${xd ? `<a href="${esc(xd)}" target="_blank" rel="noopener">Directions</a>` : ''}</div>`;
          }).join('')}</div>` : ''}`);
      }
      case 'program': {
        const rows = o.program.filter(r => r.what || r.from);
        if (!rows.length) return '';
        return sec(b, `<div class="o-tl">${rows.map(r => `<div class="o-tl-i${isBreak(r.what) ? ' brk' : ''}"><div class="o-tl-time">${esc(r.from)}${r.to ? ' – ' + esc(r.to) : ''}</div><div class="o-tl-what">${esc(r.what)}</div></div>`).join('')}</div>`);
      }
      case 'scenes': {
        const rows = o.scenes.filter(r => r.num || r.desc);
        if (!rows.length) return '';
        return sec(b, `<div class="o-rows">${rows.map(r => `<div class="o-r"><span class="t">${esc(r.num)}</span><span class="w">${esc(r.desc)}${r.meta ? `<small>${esc(r.meta)}</small>` : ''}</span></div>`).join('')}</div>`);
      }
      case 'cast': case 'crew': case 'contacts': {
        const rows = o[b.key].filter(r => r.name);
        if (!rows.length) return '';
        return sec(b, `<div class="o-people">${rows.map(r => {
          const tag = r.phone && interactive ? 'a' : 'div';
          const href = r.phone && interactive ? ` href="${telHref(r.phone)}"` : '';
          const end = r.time ? esc(r.time) : (r.phone ? ICON.phone : '');
          return `<${tag} class="o-p"${href}><span class="o-av">${esc(initials(r.name))}</span><span><div class="n">${esc(r.name)}</div>${r.role ? `<div class="r">${esc(r.role)}</div>` : ''}</span><span class="e">${end}</span></${tag}>`;
        }).join('')}</div>`);
      }
      case 'note':
        return o.notes ? sec(b, `<div class="o-note">${linkify(o.notes)}</div>`) : '';
    }
    return '';
  }).join('');

  const accent = L.accent && L.accent.toLowerCase() !== '#ffffff' ? L.accent : (L.theme === 'light' ? '#1b1a18' : '#ffffff');
  const accentStyle = `--acc:${esc(accent)}`;
  const labelInk = /^#(fff|ffffff)$/i.test(accent) ? '#111' : '#fff';

  return `
  <div class="ord t-${esc(L.theme)} s-${esc(L.size)}" style="${accentStyle}">
    ${cover ? `<div class="bgblur" style="background-image:url('${P.cover}')"></div><div class="glassveil"></div>` : ''}
    <header class="o-hero${cover ? '' : ' nocover'}">
      ${cover ? `<div class="o-cover" style="background-image:url('${P.cover}');background-position:${cp.x}% ${cp.y}%;transform:scale(${cp.z});transform-origin:${cp.x}% ${cp.y}%"></div><div class="o-shade-dim" style="opacity:${cp.o}"></div><div class="o-shade"></div>` : ''}
      ${P.logo ? `<img class="o-logo" src="${P.logo}" alt="">` : ''}

        <a class="o-made" style="letter-spacing:.04em;text-transform:none" href="${esc(new URL('../legal/roardino/?lang=el#privacy', location.href).href)}" target="_blank" rel="noopener">Απόρρητο</a>
      </footer>
    </main>
  </div>`;
}

function icsFor(o){
  const D = o.day, d = (D.date || '').replace(/-/g, '');
  const t = s => (s || '').replace(':', '') + '00';
  const start = d + 'T' + t(D.callTime || '08:00');
  let endDate = d;
  if (D.wrapTime && D.wrapTime < (D.callTime || '')){ const n = new Date(D.date + 'T12:00:00'); n.setDate(n.getDate() + 1); endDate = n.toISOString().slice(0, 10).replace(/-/g, ''); }
  const end = D.wrapTime ? endDate + 'T' + t(D.wrapTime) : start.slice(0, 9) + String(Math.min(23, +(D.callTime || '08').slice(0, 2) + 10)).padStart(2, '0') + '0000';
  const clean = s => String(s || '').replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
  const desc = [D.label, o.project.artist, ...o.program.map(p => `${p.from}${p.to ? '-' + p.to : ''} ${p.what}`), o.notes].filter(Boolean).join('\n');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Roardino//EL','BEGIN:VEVENT','UID:' + uid() + '@roardino',
    'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z',
    'DTSTART:' + start, 'DTEND:' + end, 'SUMMARY:' + clean((o.project.title || 'Γύρισμα') + ' — Call ' + (D.callTime || '')),
    'LOCATION:' + clean([o.loc.name, o.loc.address].filter(Boolean).join(', ')), 'DESCRIPTION:' + clean(desc),
    'BEGIN:VALARM','TRIGGER:-PT90M','ACTION:DISPLAY','DESCRIPTION:Call','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function wireOrdinoActions(root, o){
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'ics'){
      const blob = new Blob([icsFor(o)], { type: 'text/calendar' });
      const a = h('a', { href: URL.createObjectURL(blob), download: (o.project.title || 'ordino').replace(/[^\p{L}\d]+/gu, '-') + '.ics' });
      document.body.append(a); a.click(); a.remove();
    }
    if (b.dataset.act === 'share') navigator.share({ title: o.project.title || 'Ordino', url: location.href }).catch(() => {});
  });
}

async function route(){
  if (flushEditor){ const f = flushEditor; flushEditor = null; f(); }
  const hash = location.hash;
  const t = new URLSearchParams(location.search).get('t');
  if (t && !hash.startsWith('#edit/') && hash !== '#home') return viewToken(t);
  if (hash.startsWith('#o=')) return viewLink(hash.slice(3));
  if (hash === '#demo') return viewLink(null, demoOrdino());
  document.body.className = EMBED ? 'embedded' : '';
  if (!sb){ app.innerHTML = '<div class="v-error"><div><h2>Δεν φόρτωσε</h2><p>Έλεγξε τη σύνδεση στο internet και ανανέωσε τη σελίδα.</p></div></div>'; return; }
  if (EMBED && !session){ app.replaceChildren(h('div', { class: 'center-note' }, 'Σύνδεση με το RoarMe…')); return; }
  if (!session) return viewAuth();
  if (hash.startsWith('#edit/')){
    app.replaceChildren(h('div', { class: 'center-note' }, 'Φόρτωση…'));
    try { const o = await getOrdino(hash.slice(6)); if (o) return viewEditor(o); } catch {}
  }
  if (hash === '#admin' && isAdmin) return viewAdmin();
  return viewHome();
}
window.addEventListener('hashchange', route);

let booted = false;
async function onSignedIn(inRoarMe){
  try { await loadProfile(); } catch {}
  if (inRoarMe) return; // drafts saved in a normal browser tab are not this frame's to move
  try { const n = await importLocalDrafts(); if (n) toast(n === 1 ? 'Μπήκε 1 ordino από αυτή τη συσκευή στον λογαριασμό σου' : `Μπήκαν ${n} ordino από αυτή τη συσκευή στον λογαριασμό σου`); } catch {}
}
if (sb && !EMBED){
  sb.auth.onAuthStateChange((event, s) => {
    const was = session && session.user.id;
    session = s;
    // Supabase advises against awaiting its own calls inside this callback, so the work runs on the next tick.
    setTimeout(async () => {
      if (event === 'PASSWORD_RECOVERY') openPassword(true);
      if (!booted) return;
      const now = s && s.user.id;
      if (now && now !== was){ await onSignedIn(); if (location.hash.startsWith('#access_token') || location.hash.startsWith('#error')) history.replaceState(null, '', location.pathname); route(); }
      if (!now && was){ profile = null; route(); }
    }, 0);
  });
}
function jwtUser(t){
  try { const p = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); return p.sub ? { id: p.sub, email: p.email || '', user_metadata: p.user_metadata || {} } : null; } catch { return null; }
}
function bootEmbed(){
  document.body.classList.add('embedded');
  window.addEventListener('message', async e => {
    const d = e.data || {};
    if (e.source !== window.parent || !okParent(e.origin) || d.type !== 'roardino:session' || !d.access_token) return;
    const user = jwtUser(d.access_token); if (!user) return;
    embedToken = d.access_token; parentOrigin = e.origin;
    if (session && session.user.id === user.id) return; // a refreshed token for the same person
    session = { user };
    await onSignedIn(true);
    booted = true; route();
  });
  window.parent.postMessage({ type: 'roardino:ready' }, '*');
  route();
  setTimeout(() => { if (!session) app.replaceChildren(h('div', { class: 'v-error' }, h('div', {}, h('h2', {}, 'Δεν συνδέθηκε με το RoarMe'), h('p', {}, 'Κλείσε το παράθυρο και άνοιξέ το ξανά από τον συνδετήρα.')))); }, 10000);
}
async function boot(){
  if (EMBED) return bootEmbed();
  if (sb){
    try { const { data } = await sb.auth.getSession(); session = data.session; } catch {}
    if (session) await onSignedIn();
  }
  booted = true;
  route();
}

// A sample ordino for the Lab page and for first-time visitors: drawn cover, no stored data.
function demoOrdino(){
  const c = document.createElement('canvas'); c.width = 640; c.height = 430;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 640, 430); g.addColorStop(0, '#4b525d'); g.addColorStop(.55, '#2b3038'); g.addColorStop(1, '#15171b');
  x.fillStyle = g; x.fillRect(0, 0, 640, 430);
  const r = x.createRadialGradient(470, 150, 10, 470, 150, 260); r.addColorStop(0, 'rgba(212,0,0,.85)'); r.addColorStop(1, 'rgba(212,0,0,0)');
  x.fillStyle = r; x.fillRect(0, 0, 640, 430);
  for (let i = 0; i < 9; i++){ x.fillStyle = 'rgba(0,0,0,.45)'; x.fillRect(i * 74, 300 - ((i * 41) % 90), 56, 200); }
  const o = blankOrdino();
  const d = new Date(); d.setDate(d.getDate() + 3);
  Object.assign(o.project, { title: 'Night Shoot', artist: 'Music video · Athens', company: 'THEMADLIONS', cover: c.toDataURL('image/jpeg', .7), coverPos: { x: 50, y: 40, z: 1, o: .15 } });
  Object.assign(o.day, { date: d.toISOString().slice(0, 10), callTime: '18:30', wrapTime: '02:00', index: 1, count: 2 });
  o.groupCalls = [ { who: 'Production crew', time: '16:30' }, { who: 'Camera & lighting', time: '17:00' }, { who: 'Cast / Make-up', time: '18:30' } ];
  Object.assign(o.loc, { name: 'Rouf Railway', address: 'Konstantinoupoleos Ave, Athens 118 54', lat: '37.97640', lon: '23.70610' });
  o.program = [ { from: '18:30', to: '19:30', what: 'Set up' }, { from: '19:30', to: '22:00', what: 'Shoot · Playback' }, { from: '22:00', to: '22:30', what: 'Break' }, { from: '22:30', to: '02:00', what: 'Shoot · Story' } ];
  o.notes = 'Warm clothes, it gets cold after midnight.';
  return o;
}

// An anonymous id per browser, so the admin panel can count how many different people opened a link.
function visitorId(){
  try {
    let v = localStorage.getItem('roardino-visitor');
    if (!v){ v = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('roardino-visitor', v); }
    return v;
  } catch { return ''; }
}
async function viewToken(token){
  document.body.className = 'viewer';
  app.innerHTML = '<div class="v-error">Φόρτωση…</div>';
  let res;
  try { res = await rpc('roardino_get', { p_token: token, p_visitor: visitorId() }); }
  catch { app.innerHTML = '<div class="v-error"><div><h2>Δεν υπάρχει σύνδεση</h2><p>Έλεγξε το internet και άνοιξε ξανά το link.</p></div></div>'; return; }
  if (!res || !res.data){ app.innerHTML = '<div class="v-error"><div><h2>Αυτό το ordino δεν υπάρχει πια</h2><p>Ζήτα από την παραγωγή το τρέχον link.</p></div></div>'; return; }
  const o = normalize(res.data);
  o.blocks.forEach(b => b.on = true);
  return viewLink(null, o, res.updatedAt);
}

async function viewLink(packed, given, updatedAt){
  document.body.className = 'viewer';
  app.innerHTML = '<div class="v-error">Φόρτωση…</div>';
  let o = given;
  if (!o){
    try { o = normalize(await unpack(packed)); }
    catch { app.innerHTML = '<div class="v-error"><div><h2>Το link δεν άνοιξε</h2><p>Μάλλον κόπηκε στην αντιγραφή. Ζήτα να σου το ξαναστείλουν.</p></div></div>'; return; }
    o.blocks.forEach(b => b.on = true);
  }
  if (o.look.theme === 'light') document.body.classList.add('v-light');
  document.title = (o.project.title ? o.project.title + ' · ' : '') + (o.day.label || 'Ordino');
  const root = h('div', { class: 'viewer-root' });
  app.replaceChildren(root);
  root.innerHTML = renderOrdino(o, { updatedAt });
  wireOrdinoActions(root, o);
  if (o.details.weather || o.details.sun){
    const wx = await getWeather(o.loc.lat, o.loc.lon, o.day.date);
    if (wx){ root.innerHTML = renderOrdino(o, { wx, updatedAt }); }
  }
}

/* ---------- editor ---------- */
function viewEditor(o){
  o = normalize(o);
  let wxTimer, saveTimer, dirty = false;
  const saveState = h('span', { class: 'save-state' }, 'Αποθηκεύτηκε');
  const flush = async () => {
    clearTimeout(saveTimer);
    if (!dirty) return;
    dirty = false; saveState.textContent = 'Αποθήκευση…';
    try { await saveOrdino(o); saveState.textContent = 'Αποθηκεύτηκε'; }
    catch { dirty = true; saveState.textContent = 'Δεν αποθηκεύτηκε, ξαναδοκιμάζω…'; saveTimer = setTimeout(flush, 4000); }
  };
  const save = () => { dirty = true; saveState.textContent = 'Αλλαγές…'; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 900); };
  flushEditor = flush;
  window.onbeforeunload = () => { if (dirty){ flush(); return 'Αποθήκευση σε εξέλιξη'; } };
  const phoneScroll = h('div', { class: 'phone-scroll' });
  const refresh = async () => {
    const top = phoneScroll.scrollTop;
    phoneScroll.innerHTML = renderOrdino(o, { interactive: false });
    phoneScroll.scrollTop = top;
    clearTimeout(wxTimer);
    if ((o.details.weather || o.details.sun) && o.loc.lat){
      wxTimer = setTimeout(async () => {
        const wx = await getWeather(o.loc.lat, o.loc.lon, o.day.date);
        if (wx){ const t = phoneScroll.scrollTop; phoneScroll.innerHTML = renderOrdino(o, { wx, interactive: false }); phoneScroll.scrollTop = t; }
      }, 400);

    h(opts.area ? 'textarea' : 'input', { class: opts.area ? 'textarea' : 'input', type: opts.type || 'text', value: obj[key] ?? '', placeholder: opts.ph || '', inputmode: opts.inputmode,
      oninput: e => { obj[key] = opts.type === 'number' ? Math.max(1, +e.target.value || 1) : e.target.value; changed(); if (opts.after) opts.after(); } }));

    h('div', { class: 'li-tools' },
      h('button', { class: 'btn ghost', type: 'button', html: ICON.up, disabled: i === 0, title: 'Πάνω', onclick: () => { [o.blocks[i - 1], o.blocks[i]] = [o.blocks[i], o.blocks[i - 1]]; drawBlocks(); changed(); } }),
      h('button', { class: 'btn ghost', type: 'button', html: ICON.down, disabled: i === o.blocks.length - 1, title: 'Κάτω', onclick: () => { [o.blocks[i + 1], o.blocks[i]] = [o.blocks[i], o.blocks[i + 1]]; drawBlocks(); changed(); } })))));
  drawBlocks();

  /* accent swatches */
  const colorIn = h('input', { type: 'color', class: 'color-in', value: o.look.accent, oninput: e => { o.look.accent = e.target.value; markSw(); changed(); } });
  const sws = ACCENTS.map(c => h('button', { type: 'button', class: 'sw', style: `background:${c}`, title: c, onclick: () => { o.look.accent = c; colorIn.value = c; markSw(); changed(); } }));
  const markSw = () => sws.forEach((s, i) => s.classList.toggle('on', ACCENTS[i].toLowerCase() === o.look.accent.toLowerCase()));
  markSw();

  /* geocode: finds the spot by itself from the address (weather, sunset), unless the Maps link already has coordinates */
  const geoStatus = h('div', { class: 'hint' }, o.loc.lat ? `Καιρός και δύση για 📍 ${o.loc.lat}, ${o.loc.lon}` : 'Γράψε διεύθυνση για καιρό και ώρα δύσης.');
  const mapNote = () => !o.loc.link ? 'Directions και Open in Maps εμφανίζονται μόνο με link Google Maps.'
    : !MAPS_LINK.test(o.loc.link) ? 'Αυτό δεν είναι link του Google Maps.' : 'Directions και Open in Maps ανοίγουν ακριβώς στο σημείο του link.';
  const mapHint = h('div', { class: 'hint' }, mapNote());
  let geoT = 0;
  const autoGeo = () => {
    clearTimeout(geoT);
    if (coordsOf(o.loc.link || '')) return;
    const q = [o.loc.address, o.loc.name].filter(Boolean).join(', ');
    if (!q){ o.loc.lat = o.loc.lon = null; return; }
    geoT = setTimeout(async () => {
      geoStatus.textContent = 'Αναζήτηση τοποθεσίας…';
      try {
        let r = await geocode(q);
        if (!r && o.loc.address) r = await geocode(o.loc.address);
        if (r){ o.loc.lat = r.lat; o.loc.lon = r.lon; geoStatus.textContent = 'Καιρός και δύση για 📍 ' + r.label; changed(); }
        else geoStatus.textContent = 'Δεν βρέθηκε για τον καιρό. Γράψε οδό, αριθμό και πόλη, ή βάλε το μεγάλο link Google Maps.';
      } catch { geoStatus.textContent = 'Δεν υπάρχει σύνδεση για αναζήτηση.'; }
    }, 900);
  };

  const form = h('div', { class: 'form' },
    section('Project', 'πελάτης, τίτλος, εταιρεία', true,
      h('div', { class: 'row' }, txt(o.project, 'artist', 'Πελάτης / Καλλιτέχνης', { ph: 'π.χ. Disney' }), txt(o.project, 'title', 'Τίτλος project', { ph: 'π.χ. The Lion King' })),
      txt(o.project, 'company', 'Εταιρεία (υπογραφή στο τέλος)', { ph: 'π.χ. THEMADLIONS' })),

    section('Η μέρα', 'επικεφαλίδα, ημερομηνία, unit', true,
      h('div', { class: 'row' }, txt(o.day, 'label', 'Επικεφαλίδα', { ph: 'GENERAL ORDINO' }), txt(o.day, 'date', 'Ημερομηνία', { type: 'date' })),
      h('div', { class: 'row' }, txt(o.day, 'index', 'Ημέρα', { type: 'number', inputmode: 'numeric' }), txt(o.day, 'count', 'από', { type: 'number', inputmode: 'numeric' }),
        txt(o.day, 'unit', 'Unit', { ph: 'Main unit' }))),

    section('Ώρες', 'call, wrap, break', true,
      h('div', { class: 'row' }, txt(o.day, 'callTime', 'General call', { type: 'time' }), txt(o.day, 'wrapTime', 'Εκτιμώμενο wrap', { type: 'time' }),
        txt(o, 'lunch', 'Break / Φαγητό', { type: 'time' })),
      txt(o, 'tagline', 'Γραμμή κάτω από το call', { ph: 'π.χ. Φροντίστε για ζεστά ρούχα.' }),
      h('div', { class: 'hint' }, 'Ό,τι συμπληρώνεις φαίνεται στο ordino, ό,τι αφήνεις κενό δεν φαίνεται.')),

    blockSection('groupcalls', true,
      listEditor('groupCalls', [{ key: 'time', ph: 'Ώρα', type: 'time', w: '110px' }, { key: 'who', ph: 'Ποιος / ομάδα' }], { time: '', who: '' }, 'Ομάδα')),

    blockSection('location', true,
      h('div', { class: 'row' }, txt(o.loc, 'name', 'Όνομα χώρου', { ph: 'π.χ. Boulevart Studios', after: autoGeo }), txt(o.loc, 'address', 'Διεύθυνση', { ph: 'Οδός, αριθμός, πόλη', after: autoGeo })),
      h('label', { class: 'field' }, h('span', {}, 'Link Google Maps'),
        h('input', { class: 'input', type: 'url', inputmode: 'url', value: o.loc.link || '', placeholder: 'https://maps.app.goo.gl/…',
          oninput: e => {
            o.loc.link = e.target.value.trim();
            const c = coordsOf(o.loc.link);
            if (c){ o.loc.lat = c.lat; o.loc.lon = c.lon; geoStatus.textContent = `Καιρός και δύση για 📍 ${c.lat}, ${c.lon}`; }
            mapHint.textContent = mapNote();
            changed();
            if (!c) autoGeo();
          } })),
      mapHint, geoStatus,
      h('div', { class: 'toggles' }, tog(o.details, 'weather', 'Καιρός'), tog(o.details, 'sun', 'Ανατολή / Δύση')),
      h('div', { class: 'row' }, txt(o.loc, 'contact', 'Υπεύθυνος χώρου'), txt(o.loc, 'phone', 'Τηλέφωνο', { type: 'tel', inputmode: 'tel' })),
      txt(o.loc, 'parking', 'Parking', { area: true, ph: 'Πού παρκάρουμε, οδηγίες πρόσβασης…' }),
      txt(o.loc, 'hospital', 'Πλησιέστερο νοσοκομείο', { ph: 'Όνομα, διεύθυνση, τηλέφωνο' }),
      h('div', { class: 'field' }, h('span', {}, 'Extra locations'),
        h('div', { class: 'hint' }, 'Κι άλλοι χώροι της μέρας (π.χ. parking, base, catering). Το καθένα βγαίνει με δικό του Directions.'),
        listEditor('extraLocs', [{ key: 'name', ph: 'Όνομα' }, { key: 'address', ph: 'Διεύθυνση' }, { key: 'link', ph: 'Link Google Maps', type: 'url' }], { name: '', address: '', link: '' }, 'Τοποθεσία'))),

    blockSection('program', true,
      listEditor('program', [{ key: 'from', ph: 'Από', type: 'time', w: '100px' }, { key: 'to', ph: 'Έως', type: 'time', w: '100px' }, { key: 'what', ph: 'Τι γίνεται' }], { from: '', to: '', what: '' }, 'Γραμμή')),

    blockSection('scenes', false,
      listEditor('scenes', [{ key: 'num', ph: 'Σκ.', w: '70px' }, { key: 'desc', ph: 'Περιγραφή' }, { key: 'meta', ph: 'INT/EXT · Μέρα', w: '1fr' }], { num: '', desc: '', meta: '' }, 'Σκηνή')),
    blockSection('cast', false,
      listEditor('cast', [{ key: 'name', ph: 'Όνομα' }, { key: 'role', ph: 'Ρόλος' }, { key: 'time', ph: 'Call', type: 'time', w: '100px' }], { name: '', role: '', time: '' }, 'Ηθοποιός')),
    blockSection('crew', false,
      listEditor('crew', [{ key: 'name', ph: 'Όνομα' }, { key: 'role', ph: 'Θέση' }, { key: 'time', ph: 'Call', type: 'time', w: '100px' }], { name: '', role: '', time: '' }, 'Μέλος')),
    blockSection('contacts', false,
      listEditor('contacts', [{ key: 'name', ph: 'Όνομα' }, { key: 'role', ph: 'Θέση' }, { key: 'phone', ph: 'Τηλέφωνο', type: 'tel', inputmode: 'tel' }], { name: '', role: '', phone: '' }, 'Επαφή')),
    blockSection('note', false,
      txt(o, 'notes', 'Σημείωση', { area: true, ph: 'Πληροφορίες, τηλέφωνα επικοινωνίας… (τα τηλέφωνα γίνονται κλικ)' })),

    section('Εμφάνιση', 'θέμα, χρώμα, cover, σειρά', false,
      h('div', { class: 'field' }, h('span', {}, 'Θέμα'), seg(o.look, 'theme', [['dark','Dark'],['glass','Glass'],['light','Light']])),
      h('div', { class: 'field' }, h('span', {}, 'Χρώμα'), h('div', { class: 'swatches' }, sws, colorIn)),
      h('div', { class: 'row' },
        h('div', { class: 'field' }, h('span', {}, 'Κεφαλίδα'), seg(o.look, 'header', [['centred','Κέντρο'],['left','Αριστερά']])),
        h('div', { class: 'field' }, h('span', {}, 'Μέγεθος γραμμάτων'), seg(o.look, 'size', [['normal','Κανονικό'],['small','Μικρό']]))),
      h('div', { class: 'row' }, imagePicker('Φωτογραφία cover', 'cover', 1400, 'image/jpeg'), imagePicker('Λογότυπο', 'logo', 400, 'image/png', true)),
      tog(o.details, 'cover', 'Δείξε τη φωτογραφία cover'),
      h('div', { class: 'row' }, range('Θέση οριζόντια', 'x', 0, 100, 1), range('Θέση κάθετα', 'y', 0, 100, 1)),
      h('div', { class: 'row' }, range('Zoom', 'z', 1, 2.5, 0.05), range('Σκοτείνιασμα', 'o', 0, 0.85, 0.05)),
      h('div', { class: 'field' }, h('span', {}, 'Σειρά ενοτήτων'),
        h('div', { class: 'hint' }, 'Άλλαξε τη σειρά με τα βελάκια και, αν θες, δώσε δικό σου τίτλο. Ποια φαίνονται το ανοίγεις και το κλείνεις στον τίτλο κάθε ενότητας.'),
        blocksWrap)),
  );

  const ed = h('div', { class: 'editor', 'data-view': 'edit' },
    form,
    h('aside', { class: 'preview-wrap' }, h('div', { class: 'preview-label' }, 'Έτσι θα το δουν στο κινητό'), h('div', { class: 'phone' }, phoneScroll)));
  const tabs = h('div', { class: 'mobile-tabs' },
    h('button', { class: 'on', type: 'button', onclick: e => setView('edit', e.target) }, 'Επεξεργασία'),
    h('button', { type: 'button', onclick: e => setView('preview', e.target) }, 'Προεπισκόπηση'));
  function setView(v, btn){ ed.dataset.view = v; [...tabs.children].forEach(c => c.classList.toggle('on', c === btn)); window.scrollTo({ top: 0 }); }

  app.replaceChildren(
    h('header', { class: 'topbar' },
      h('a', { class: 'btn icon ghost', href: BASE + '#home', title: 'Πίσω', html: ICON.back }),
      brandMark(true),
      h('div', { class: 'spacer' }),
      saveState,
      h('button', { class: 'btn tb', title: 'Duplicate: νέο ordino με όλα αυτά μέσα', 'aria-label': 'Duplicate', onclick: async e => {
        const b = e.currentTarget; b.disabled = true; await flush();
        try { const c = await duplicateOrdino(o); toast('Έγινε αντίγραφο, τώρα είσαι σε αυτό'); location.hash = '#edit/' + c.id; } catch { toast('Δεν έγινε αντίγραφο'); }
        b.disabled = false;
      } }, h('span', { html: ICON.dup }), h('span', { class: 'lbl' }, 'Duplicate')),
      EMBED
        ? h('button', { class: 'btn primary tb', 'aria-label': 'Στείλε στη συνομιλία', onclick: async e => { const b = e.currentTarget; b.disabled = true; await flush(); await sendToChat(o); b.disabled = false; } }, h('span', { html: ICON.share }), h('span', { class: 'lbl' }, 'Στείλε στη συνομιλία'))
        : h('button', { class: 'btn primary tb', 'aria-label': 'Αποστολή link', onclick: () => openShare(o) }, h('span', { html: ICON.share }), h('span', { class: 'lbl' }, 'Αποστολή link'))),
    ed, tabs);
  document.title = (o.project.title || 'Νέο ordino') + ' · Roardino';
  refresh();
}

/* ---------- share modal ---------- */
async function openShare(o){
  const input = h('input', { class: 'input', readonly: true, value: 'Ανέβασμα…', onfocus: e => e.target.select() });
  const status = h('p', {}, o.token ? 'Ενημερώνω το ίδιο link με τις αλλαγές σου…' : 'Φτιάχνω το link…');
  const close = () => bg.remove();
  const btns = h('div', { class: 'linkbox' },
    h('button', { class: 'btn primary', style: 'flex:1', onclick: async () => { try { await navigator.clipboard.writeText(input.value); toast('Αντιγράφηκε'); } catch { input.select(); document.execCommand('copy'); toast('Αντιγράφηκε'); } } }, 'Αντιγραφή'),
    navigator.share ? h('button', { class: 'btn', style: 'flex:1', onclick: () => navigator.share({ title: o.project.title || 'Ordino', text: `${o.day.label || 'Ordino'} · ${o.project.title || ''} · Call ${o.day.callTime || ''}`, url: input.value }).catch(() => {}) }, 'Κοινοποίηση') : null,
    h('a', { class: 'btn', style: 'flex:1', target: '_blank', rel: 'noopener', href: '#', onclick: e => { e.currentTarget.href = input.value; } }, 'Άνοιγμα'));
  btns.style.visibility = 'hidden';
  const bg = h('div', { class: 'modal-bg', onclick: e => { if (e.target === bg) close(); } },
    h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' },
      h('h3', {}, 'Στείλε το ordino'), status,
      h('div', { class: 'linkbox' }, input), btns,
      h('button', { class: 'btn ghost', onclick: close }, 'Κλείσιμο')));
  document.body.append(bg);
  const had = !!o.token;
  try {
    input.value = await publishOrdino(o);
    status.textContent = had
      ? 'Έτοιμο. Το link είναι το ίδιο, όποιος το ανοίξει βλέπει πια τις αλλαγές.'
      : 'Όποιος έχει το link βλέπει το ordino στο κινητό του, χωρίς λογαριασμό. Αν αλλάξεις κάτι, πάτα ξανά «Αποστολή link»: το ίδιο link ενημερώνεται.';
  } catch {
    input.value = await buildShareUrl(o);
    status.textContent = 'Δεν υπήρχε σύνδεση με τον server, οπότε έφτιαξα link που κουβαλάει όλο το ordino μέσα του. Δουλεύει κανονικά, αλλά δεν ενημερώνεται αν αλλάξεις κάτι. Όταν επανέλθει η σύνδεση, πάτα ξανά «Αποστολή link».';
  }
  btns.style.visibility = '';
}

boot();
</script>
</body>
</html>
