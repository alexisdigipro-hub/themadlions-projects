<!-- always the newest Roardino at the plain address (Alex, 5 Nov: "no different links, just themadlions.com/social"):
     Safari may keep an old copy of this page; it asks version.json (never cached) and, if a newer one is out, loads it once.
     While it asks (at most 0.9 s) the page stays hidden behind the wordmark, so an old layout never shows first (Alex, 6 Nov).
     A ?v= it used is taken off the address again. Raise V here and in version.json together with the ?v= below. -->
<script>(function(){var V="20261110n";window.RD_V=V;try{if(/[?&]v=/.test(location.search))history.replaceState(null,"",location.pathname+location.hash)}catch(e){}
var R=document.documentElement;R.classList.add("vcheck");var done=function(){R.classList.remove("vcheck")};setTimeout(done,900);try{fetch("version.json?"+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){if(j&&j.v&&j.v!==V&&!sessionStorage.getItem("rd-upd-"+j.v)){sessionStorage.setItem("rd-upd-"+j.v,"1");location.replace(location.pathname+"?v="+j.v+location.hash)}else done()}).catch(done)}catch(e){done()}})()</script>
<script>(function(){var r=document.documentElement;r.className+=" booting";var d=false;try{var s=JSON.parse(localStorage.getItem("roardino-prefs")||"{}"),m=s.theme||"auto";d=m==="dark"||(m==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);if(d)r.dataset.theme="dark";if(s.text)document.documentElement.dataset.text=s.text;if(s.accent&&s.accent!=="red")r.dataset.accent=s.accent}catch(e){}r.style.background=d?"#1f2328":"#eceef1";r.style.colorScheme=d?"dark":"light";var t=document.querySelector("meta[name=theme-color]");if(t)t.content=d?"#1f2328":"#eceef1"})()</script>
