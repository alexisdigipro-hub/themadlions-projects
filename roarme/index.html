<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2328" />
    <meta name="description" content="RoarMe, the chat of THEMADLIONS, on its own." />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <!-- RoarMe as its own app (Alex, 20 Oct): a page of its own under /roarme/, so a phone installs RoarMe and not
         the whole hub (its own manifest, icon and scope). Same code as index.html, opening straight on RoarMe. -->
    <script>if (!/^#\/(roarme-app|login)/.test(location.hash)) location.replace('#/roarme-app')</script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RoarMe" />
    <!-- drawn up under the clock; the page pads RoarMe down by the safe area (styles.css, .roarme-page.full) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <title>RoarMe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
