name: Android app (TML Chat)

# Builds TML Chat for Android (android-app/: a Capacitor shell that opens the live chat page, so the
# app shows every change to the site without a new APK). A pull request only builds; main and a
# manual run also publish the APK on the release "android", at a link that never changes:
# https://github.com/alexisdigipro-hub/themadlions-projects/releases/download/android/tml-chat.apk
on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android.yml', 'public/icons/chat-icon-512.png']
  pull_request:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android.yml', 'public/icons/chat-icon-512.png']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor project
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          bash prepare.sh
          npx cap sync android
      - name: Build the APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk tml-chat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tml-chat-apk
          path: tml-chat.apk
      - name: Publish at the fixed link
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "TML Chat for Android" --notes "TML Chat for Android. Open the link on the phone, download, then open the file and allow installing apps from this source." --latest=false
          gh release upload android tml-chat.apk --clobber
