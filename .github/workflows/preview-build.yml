# temporary: builds the team build into preview-dist/ on this branch, for a local check (Claude, 22 Oct)
name: preview build
on:
  push:
    branches: ['claude/peaceful-pascal-dbgey5']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx vite build --outDir preview-dist
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f preview-dist
          git commit -qm "preview build"
          git push origin HEAD:${{ github.ref_name }}
