name: Local-mode build for checks

# A build of the app in local mode (no Supabase, everything in the browser), pushed to the branch checks/local-build
# (nothing else on it, never merged), so a session without the npm registry can fetch it with git, open every page
# in a browser and check it. Runs on pushes to claude/* branches.
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vite build --outDir dist-local
        env:
          VITE_LOCAL_MODE: '1'
      - name: Push the build to checks/local-build
        run: |
          cd dist-local
          git init -q -b checks/local-build
          git config user.name "local-build"; git config user.email "local-build@users.noreply.github.com"
          git add -A; git commit -qm "local-mode build of ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" checks/local-build
