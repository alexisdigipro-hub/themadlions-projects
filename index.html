<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1: an iPhone zooms the page in when a box with text under 16px is tapped (the Home search, Alex 11:31) and leaves it zoomed and shifted sideways; this stops that zoom, and iOS still lets you pinch to zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17181c" />
    <meta name="description" content="THEMADLIONS Projects. Film production workspace: scripts, breakdowns, schedules, call sheets, calendar, locations, cast and crew." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- Add to Home Screen. iOS ignores the manifest icons and reads apple-touch-icon, so both are here. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="THEMADLIONS" />
    <!-- The app's background runs up under the clock and the battery (Alex, 9 Oct), as in TML Chat:
         black-translucent starts the page at the very top, and the phone's top bar, side menu, sheets
         and the view-as strip pad themselves by env(safe-area-inset-top) (end of styles.css). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <title>THEMADLIONS Projects</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
